<!DOCTYPE html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>TENET · Отдел продаж</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
:root {
  --bg:#f4f1ea;
  --fg:#111114;
  --muted:#5c5a54;
  --surface:#fffcf7;
  --border:#e4dfd4;
  --primary:#c81e2b;
  --primary-ink:#fff;
  --pass:#1f7a4d;
  --ok-bg:#e8f6ee;
  --bad-bg:#fdecee;
  --shadow:0 1px 0 rgba(17,17,20,.04), 0 12px 40px rgba(17,17,20,.06);
  --radius:14px;
}
* { box-sizing:border-box; }
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.011em;}
button,[role=button]{cursor:pointer;font-family:inherit;}
button:disabled{cursor:not-allowed;opacity:.4;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 56px;}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(10px);padding:10px 0 12px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase;}
.mark{width:28px;height:28px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;border-radius:7px;font-weight:800;}
nav.desk{display:flex;flex-wrap:wrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
nav.desk button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;}
nav.desk button.on{background:var(--fg);color:#fff;}
nav.bot{display:none!important;}
.eyebrow{letter-spacing:.22em;color:var(--primary);font-size:11px;text-transform:uppercase;margin:0 0 8px;font-weight:700;}
h1{font-size:clamp(36px,7vw,64px);line-height:.92;margin:0;letter-spacing:-.04em;font-weight:800;}
h1 span{display:block;color:var(--muted);font-weight:600;}
h2{letter-spacing:-.02em;margin:0;font-weight:700;}
.lead{color:var(--muted);line-height:1.55;max-width:440px;font-size:15px;}
.grid2{display:grid;gap:14px;margin-top:24px;}
.card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:left;}
.card h3{font-size:22px;margin:8px 0 6px;letter-spacing:-.03em;}
.card p{color:var(--muted);font-size:14px;line-height:1.5;margin:0;}
label.field{display:block;max-width:340px;margin-top:18px;}
label.field span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;}
input,textarea{width:100%;background:#fff;border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:12px;font:15px Inter,sans-serif;}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:28px;}.actions>*{width:100%;}
.models{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
@media(min-width:720px){.grid2{grid-template-columns:1.1fr .9fr;}.actions{display:flex;flex-direction:column;}}
.rank{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.rank b{font-size:16px;}
.rank.guest,.rank.head{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px;align-items:center;gap:8px;}
.rank.head{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:8px;}
.rank.head span:nth-child(2),.rank.head span:nth-child(3),.rank.guest .pct{text-align:right;}
.rank .place-n{width:28px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;}
.pct{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;letter-spacing:-.04em;white-space:nowrap;}
.empty{color:var(--muted);padding:8px 0;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:8px 0 6px;min-height:210px;}
.pod{flex:1;max-width:200px;text-align:center;min-width:0;}
.pod .who{font-weight:800;font-size:14px;letter-spacing:-.02em;margin:0 0 8px;line-height:1.2;word-break:break-word;}
.pod .who span{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}
.pod .step{border-radius:12px 12px 4px 4px;padding:14px 8px 12px;color:#fff;}
.pod.p1 .step{min-height:128px;background:linear-gradient(180deg,#f0d36a,#c9a227);}
.pod.p2 .step{min-height:96px;background:linear-gradient(180deg,#d7dce2,#8b929a);}
.pod.p3 .step{min-height:76px;background:linear-gradient(180deg,#e0b07a,#b87333);}
.pod .place{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.9;}
.pod .score{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-top:6px;}
.pod.ghost .who{color:var(--muted);font-weight:600;}
.pod.ghost .step{background:#efeae0;color:var(--muted);min-height:64px;}
.banner{min-height:150px;border:1px solid var(--border);border-radius:20px;margin-top:8px;background:radial-gradient(1200px 200px at 100% 0,#f7d7d9 0,transparent 50%),linear-gradient(180deg,#fff,#f3efe6);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px;box-shadow:var(--shadow);}
.banner b{font-size:28px;letter-spacing:-.03em;}
.banner-name{font-size:clamp(40px,8vw,64px);line-height:.85;letter-spacing:-.06em;font-weight:800;color:#161618;}
.card.ok{border-color:#9ad4b4;background:var(--ok-bg);}
.card.bad{border-color:#f0b4b8;background:var(--bad-bg);}
.tabs{display:flex;flex-wrap:wrap;gap:0;border:0;background:transparent;border-bottom:1px solid var(--border);border-radius:0;padding:0;width:100%;margin:18px 0 8px;}
.tabs button{border:0;background:transparent;color:var(--muted);border-radius:0;padding:10px 16px 12px;font-weight:600;font-size:14px;position:relative;}
.tabs button.on{background:transparent;color:var(--fg);}
.tabs button.on:after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;background:var(--primary);}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;}
.btn.ivory{background:var(--primary);color:#fff;}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border);}
.bar{height:3px;background:#e8e5de;border-radius:99px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--primary);width:0;}
.opt{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:12px;padding:13px;display:flex;gap:10px;margin:8px 0;font-weight:500;}
.opt.on{border-color:var(--primary);background:#fff5f5;}
.opt.good{border-color:var(--pass);background:var(--ok-bg);}
.opt.bad{border-color:var(--primary);background:var(--bad-bg);}
.explain{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;font-size:14px;line-height:1.5;background:var(--surface);}
.clock{font-variant-numeric:tabular-nums;font-size:28px;font-weight:800;letter-spacing:-.04em;}
.clock.warn{color:var(--primary);}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg);}
.study-pick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;}
.study-pick .chip{flex:0 0 auto;white-space:nowrap;}
.rate-board{display:flex;gap:10px;overflow-x:auto;margin-top:16px;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
.rate-col{flex:1 0 196px;min-width:196px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:12px 12px 10px;box-shadow:var(--shadow);}
.rate-col .eyebrow{margin-bottom:2px;}
.rate-col h3{font-size:17px;margin:0 0 10px;letter-spacing:-.03em;}
.rate-head,.rate-person{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;gap:4px;align-items:center;}
.rate-head{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 0 6px;border-bottom:1px solid var(--border);}
.rate-head span:nth-child(2),.rate-head span:nth-child(3),.rate-person .pct{text-align:right;}
.rate-person{padding:8px 0;border-bottom:1px solid var(--border);}
.rate-person b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rate-person p{margin:0;font-size:11px;color:var(--muted);line-height:1.3;}
.rate-person .pct{font-size:14px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;}
.rate-person .pct.ok{color:var(--pass);}
.rate-person .pct.low{color:var(--primary);}
.rate-split{margin:10px 0 4px;border:0;border-top:1px solid var(--fg);padding-top:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.rate-col .empty{font-size:12px;padding:6px 0 4px;}

.model-card .car{display:none;}
.models{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
.model-row{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  margin-top:18px;
}
.models .card,
.model-card{
  position:relative;
  display:flex;
  flex-direction:column;
  padding:0;
  overflow:hidden;
  min-height:0;
  text-align:left;
  background:#fffcf7;
}
.models .card::before,
.model-row .card::before{
  content:"";
  display:block;
  width:100%;
  aspect-ratio:16/10;
  background-color:#efeae0;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
  border-bottom:1px solid var(--border);
}
.model-row .card::before{aspect-ratio:4/5;}
.models .card::after{content:none!important;display:none!important;}
.models .card[data-model="t4l"]::before,
.model-row .card[data-model="t4l"]::before{background-image:url("cars/t4l.jpg"),url("https://img.perxis.ru/unsafe/960x600/filters:format(jpeg):quality(78)/chry/originals/d7p04gqto5r7ch3usvi0/original");}
.models .card[data-model="t7"]::before,
.model-row .card[data-model="t7"]::before{background-image:url("cars/t7.jpg?v=3");background-position:40% 50%;}
.models .card[data-model="t8"]::before,
.model-row .card[data-model="t8"]::before{background-image:url("cars/t8.jpg?v=3");background-position:52% 55%;}
.models .card[data-model="t9"]::before,
.model-row .card[data-model="t9"]::before{background-image:url("cars/t9.jpg"),url("https://img.perxis.ru/unsafe/960x600/filters:format(jpeg):quality(78)/chry/originals/d9avnv2to5r6hlpdspfg/original");}
.models .card[data-model="a8"]::before,
.model-row .card[data-model="a8"]::before{background-image:url("cars/a8.jpg"),url("https://img.perxis.ru/unsafe/960x600/filters:format(jpeg):quality(78)/chry/originals/d9avncqto5r6hlpdspeg/original");}
.models .card .txt,
.model-row .card .txt{
  position:relative;
  z-index:1;
  max-width:none;
  padding:12px 12px 14px;
}
.models .card .eyebrow,
.model-row .card .eyebrow{margin:0 0 4px;}
.models .card h3{margin:0 0 6px;font-size:20px;}
.model-row .card h3{margin:0 0 4px;font-size:16px;letter-spacing:-.03em;}
.models .card p,
.model-row .card p{max-width:none;}
.model-row .card p{
  font-size:12px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.models .card:hover,
.model-row .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(17,17,20,.08);}
.model-row .card.is-on{border-color:#161618;}
@media (max-width:820px){
  .model-row{
    display:flex;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:6px;
  }
  .model-row .card{flex:0 0 168px;}
}
.hidden{display:none!important;}
.study-body p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 10px;}
.study-body ul{margin:0 0 12px;padding:0 0 0 18px;color:var(--muted);font-size:14px;line-height:1.55;}
.study-body li{margin:5px 0;}
.study-body b,.study-body strong{color:var(--fg);font-weight:700;}
.study-body h3{font-size:15px;margin:14px 0 8px;letter-spacing:-.02em;}
.study-body h3:first-child{margin-top:0;}
.docs{display:grid;gap:10px;}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.doc h3{margin:4px 0 6px;font-size:18px;}
.doc .meta{color:var(--muted);font-size:13px;margin:0;line-height:1.4;}
.doc .acts{display:flex;gap:8px;flex-wrap:wrap;}
.doc-strip{display:grid;gap:8px;margin-top:16px;}
.doc-mini{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;}
.doc-mini b{font-size:13px;}
.doc-mini span{color:var(--muted);}
.doc-mini a{font-weight:700;border-bottom:1px solid var(--border);}
.hub-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:22px;}
@media(min-width:640px){.hub-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.hub-grid{grid-template-columns:repeat(3,1fr);}}
.hub-card{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  padding:0;
  overflow:hidden;
  min-height:0;
  text-align:left;
  background:#fffcf7;
}
.hub-card::before{
  content:"";
  display:block;
  width:100%;
  aspect-ratio:16/10;
  background-color:#efeae0;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
  border-bottom:1px solid var(--border);
}
.hub-card[data-go="home"]::before{background-image:url("hub/attest.jpg?v=2");background-position:50% 55%;}
.hub-card[data-go="terms"]::before{background-image:url("hub/terms.jpg?v=1");background-position:55% 42%;}
.hub-card[data-go="calc"]::before{background-image:url("hub/calc.jpg?v=1");background-position:38% 48%;}
.hub-card[data-go="stock"]::before{background-image:url("hub/stock.jpg?v=3");background-position:50% 58%;}
.hub-card[data-go="docs"]::before{background-image:url("hub/docs.jpg?v=1");background-position:50% 50%;}
.hub-mark{
  position:absolute;
  top:12px;left:12px;z-index:1;
  width:36px;height:36px;border-radius:10px;
  background:var(--primary);color:#fff;
  display:grid;place-items:center;
  font-weight:800;font-size:13px;
  box-shadow:0 8px 20px rgba(17,17,20,.18);
}
.hub-card .txt{padding:14px 14px 16px;}
.hub-card h3{margin:0 0 6px;font-size:22px;letter-spacing:-.03em;}
.hub-card p{margin:0;max-width:none;}
.hub-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(17,17,20,.08);}
.who-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0;}
.sheet{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 18px;}
.sheet th,.sheet td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.sheet th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.sheet .num{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;white-space:nowrap;}
.st{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.04em;}
.st.in{background:var(--ok-bg);color:var(--pass);}
.st.hold{background:#f7ead0;color:#8a5a12;}
.st.way{background:#ece9e2;color:var(--muted);}
.st.inv{background:#f3d5d4;color:var(--primary);}
.vin{font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.02em;white-space:nowrap;}
.calc-grid{display:grid;gap:14px;margin-top:18px;}
@media(min-width:720px){.calc-grid{grid-template-columns:1.05fr .95fr;}}
.calc-out{font-size:clamp(32px,6vw,48px);font-weight:800;letter-spacing:-.04em;margin:4px 0 8px;}
.calc-note{color:var(--muted);font-size:13px;line-height:1.45;margin:0;}
.note-box{border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.45;margin:12px 0 8px;}
.brand{cursor:pointer;}

</style>
</head>

      if(i<=0) return S/n;
      const k=Math.pow(1+i,n);
      return S*i*k/(k-1);
    }

        function rate(){
      if(!state.surname) return login();
      const local=Object.values(state.locks||{});
      const all=[...remoteLocks, ...local].filter(r=>r && r.surname);
      function bestMap(examNo, modelId){
        const rows=all.filter(r=>Number(r.exam||1)===examNo && (r.model||"t4l")===modelId && r.status!=="running");
        const map={};
        rows.forEach(r=>{
          const k=norm(r.surname||r.display);
          if(!map[k] || (r.percent||0)>(map[k].percent||0)) map[k]={name:r.display||r.surname, percent:r.percent, key:k};
        });
        return map;
      }
      function pair(key, name, modelId){
        const a=bestMap(1, modelId)[key];
        const b=bestMap(2, modelId)[key];
        return {key, name:(a&&a.name)||(b&&b.name)||name, was:a?a.percent:null, now:b?b.percent:null};
      }
      function pctCell(v){
        if(v==null) return `<span class="pct">—</span>`;
        const cls=v>=EXPERT?"ok":v<PASS?"low":"";
        return `<span class="pct ${cls}">${v}%</span>`;
      }
      function personRow(p, wait){
        const extra=wait && p.was==null && p.now==null ? `<p>ещё не сдавал</p>` : "";
        return `<div class="rate-person"><div><b>${escape(p.name)}</b>${extra}</div>${pctCell(p.was)}${pctCell(p.now)}</div>`;
      }
      function modelCol(m){
        const staffRows=STAFF.map((key,i)=>pair(key, STAFF_SHOW[i], m.id));
        const taken=staffRows.filter(p=>p.was!=null || p.now!=null)
          .sort((a,b)=>(b.was||0)-(a.was||0) || a.name.localeCompare(b.name,"ru"));
        const wait=staffRows.filter(p=>p.was==null && p.now==null);
        const guestKeys=new Set();
        [1,2].forEach(n=>{
          Object.values(bestMap(n, m.id)).forEach(p=>{ if(!STAFF.includes(p.key)) guestKeys.add(p.key); });
        });
        const guests=Array.from(guestKeys).map(k=>{
          const a=bestMap(1,m.id)[k]; const b=bestMap(2,m.id)[k];
          return pair(k, (a&&a.name)||(b&&b.name)||k, m.id);
        }).sort((a,b)=>(b.was||0)-(a.was||0) || a.name.localeCompare(b.name,"ru"));
        return `<div class="rate-col">
          <div class="eyebrow">${m.brand}</div>
          <h3>${m.name}</h3>
          <div class="rate-head"><span>состав</span><span>было</span><span>стало</span></div>
          ${taken.length?taken.map(p=>personRow(p,false)).join(""):""}
          ${wait.map(p=>personRow(p,true)).join("")}
          ${!taken.length && !wait.length?`<p class="empty">Пока пусто</p>`:""}
          <div class="rate-split">гости</div>
          ${guests.length?guests.map(p=>personRow(p,false)).join(""):`<p class="empty">Нет гостевых сдач</p>`}
        </div>`;
      }
      const pinNeeded=hasExam1() && !expertLocked() && !hasExam2();
      return `<p class="eyebrow">Отдел продаж</p><h1 style="font-size:40px">Рейтинг</h1>
        <p class="lead">Все модели в одном блоке. Основной список — состав салона. Гости в той же колонке, под чертой. «Стало» появляется только после пересдачи (если №1 была ниже 90%).</p>
        <p style="color:var(--muted);font-size:13px">Облако рейтинга: ${syncOk?"онлайн, все видят одни результаты":"пока не отвечает — нажмите обновить"}. <button class="btn ghost" id="syncNow">Обновить</button></p>
        <div class="rate-board">${Object.values(MODELS).map(modelCol).join("")}</div>
        ${pinNeeded?`
        <p style="color:var(--muted);font-size:13px;margin-top:16px">Код РОП открывает тренировку и пересдачу по модели, выбранной на старте.</p>
        <div class="card" style="margin-top:12px">
          <b>Код РОП</b>
          <label class="field"><span>Код для ${escape(state.display)} / ${MODELS[model].name}</span><input id="pin" /></label>
          <p id="pinErr" style="color:var(--primary)">${pinErr}</p>
          <button class="btn ghost" id="unlockHist">Открыть тренировку и пересдачу</button>
        </div>`:`<p style="color:var(--muted);font-size:13px;margin-top:16px">${expertLocked()?"По этой модели 90%+ уже закреплены.":hasExam2()?"Пересдача по выбранной модели уже в колонке «стало».":"Сначала аттестация №1 — затем рейтинг зафиксирует результат."}</p>`}`;
    }

        function okNow(q){ return q.c.length===selected.length && q.c.every(x=>selected.includes(x)); }
    function tryUnlock(code){
      if((code||"").trim().toUpperCase()!==PIN){ pinErr="Неверный код."; render(); return; }
      if(!hasExam1()){ pinErr="Сначала аттестация №1."; render(); return; }
      if(expertLocked()){ pinErr="90%+ уже засчитаны. Пересдача не нужна."; render(); return; }
      if(hasExam2()){ pinErr="Пересдача по этой модели уже использована."; render(); return; }
      state.unlock[lockKey(state.surname, model, 2)]=true; save(); pinErr=""; render();
    }
    function compactPaper(){ return paper.map(q=>({id:q.id, o:(q.o||[]).map(x=>x[0])})); }
    function hydratePaper(run){
      const Q = QBY[run.model] || T4L_Q;
      const byId = {};
      Q.forEach(q=>byId[q.id]=q);
      const out=[];
      (run.paper||[]).forEach(s=>{
        const q = byId[s.id];
        if(!q) return;
        const order = Array.isArray(s.o)?s.o:[];
        const opts = order.map(id=>q.o.find(x=>x[0]===id)).filter(Boolean);
        out.push(opts.length===q.o.length ? {...q, o:opts} : {...q, o:q.o.slice()});
      });
      return out;
    }
    function persistRun(syncCloud){
      if(mode!=="exam" || done || !state.surname || !paper.length) return Promise.resolve();
      const sn=norm(state.surname);
      const prev=(state.runs||{})[sn]||{};
      const run={
        surname:sn, display:state.display, model, exam:examSession||1, status:"running",
        paper:compactPaper(), idx, answers, selected,
        qDeadline, startedAt: prev.startedAt || Date.now(), updatedAt: Date.now()
      };
      state.runs = state.runs || {};
      state.runs[sn] = run;
      save();
      if(!syncCloud) return Promise.resolve();
      return upsertLock({
        surname:run.surname, display:run.display, model:run.model, exam:run.exam,
        percent:0, at:new Date(run.startedAt).toISOString(), attempts:1,
        status:"running",
        run:{paper:run.paper, idx:run.idx, answers:run.answers, selected:run.selected, qDeadline:run.qDeadline, startedAt:run.startedAt}
      });
    }
    function catchUp(){
      if(mode!=="exam" || done || !paper.length) return;
      if(!qDeadline) qDeadline = Date.now() + QSEC*1000;
      left = Math.max(0, Math.ceil((qDeadline - Date.now())/1000));
      if(left>0) return;
      if(answers[idx]==null){
        const q=paper[idx];
        answers[idx]={id:q.id,ok:false,cat:q.cat,p:q.p,x:q.x};
      }
      if(idx+1>=paper.length){ finish(); return; }
      idx++; selected=[]; locked=false;
      qDeadline = Date.now() + QSEC*1000;
      left = QSEC;
      persistRun(true);
    }
    function resumeExam(run){
      if(!run) return false;
      stopTick();
      if(run.broken || !run.paper || !run.paper.length){
        model = run.model || model;
        state.model = model;
        examSession = run.exam || 1;
        mode="exam";
        paper = [{id:"gone",cat:"tech",type:"single",p:"Сессия прервана",o:[["a","—"]],c:["a"],x:""}];
        answers = [{id:"gone",ok:false,cat:"tech",p:"Сессия прервана",x:""}];
        idx=0; done=false; closing=false;
        finish();
        return true;
      }
      model = run.model || model;
      state.model = model; save();
      examSession = run.exam || 1;
      window._wantExam = examSession;
      mode="exam";
      paper = hydratePaper(run);
      if(!paper.length){
        run.broken = true;
        return resumeExam(run);
      }
      idx = Math.min(Math.max(0, run.idx||0), paper.length-1);
      answers = Array.isArray(run.answers)?run.answers.slice():[];
      selected = Array.isArray(run.selected)?run.selected.slice():[];
      locked=false; done=false; closing=false;
      qDeadline = run.qDeadline || (Date.now()+QSEC*1000);
      view="play";
      catchUp();
      if(!done){ render(); startTick(); persistRun(true); }
      return true;
    }
    async function start(kind, cat="all", examNo){
      if(kind==="exam"){
        const existing = userRun();
        if(existing){ resumeExam(existing); return; }
        const n = examNo || examSession || 1;
        if(n===1 && !canExam1()){ view="quiz"; render(); return; }
        if(n===2 && !canExam2()){ view="quiz"; render(); return; }
        examSession = n;
        stopTick();
        mode="exam";
        paper = pickExam();
        idx=0; selected=[]; locked=false; done=false; closing=false; answers=[];
        correct=0; missed=[]; byCat={}; elapsed=0;
        qDeadline = Date.now() + QSEC*1000;
        left = QSEC;
        persistRun(false);
        view="play"; render();
        startTick();
        persistRun(true);
        return;
      }
      if(kind==="practice"){
        if(!canPractice()){ view="home"; render(); return; }
        if(userRun()){ resumeExam(userRun()); return; }
        state.seenTrain[model]=true; save();
      }
      stopTick();
      mode=kind;
      paper = pickPractice(cat);
      idx=0; selected=[]; locked=false; done=false; closing=false; answers=[];
      correct=0; missed=[]; byCat={}; elapsed=0; left=QSEC;
      qDeadline=0;
      view="play"; render();
    }
    function startTick(){
      stopTick();
      const beat=()=>{
        if(done || mode!=="exam"){ stopTick(); return; }
        left = Math.max(0, Math.ceil((qDeadline - Date.now())/1000));
        if(left===0 && !locked && !done) timeout();
        else if(!done){
          const c=document.querySelector(".clock");
          if(c){ c.className="clock"+(left<=5?" warn":""); c.innerHTML=left+' <small style="font-size:14px;color:var(--muted)">сек</small>'; }
        }
      };
      beat();
      tick=setInterval(beat, 250);
    }
    function stopTick(){ if(tick) clearInterval(tick); tick=null; }
    function timeout(){ commitAndNext(false); }
    function commitAndNext(ok){
      if(done||closing) return;
      closing=true;
      const q=paper[idx];
      if(answers[idx]==null) answers[idx]={id:q.id,ok:!!ok,cat:q.cat,p:q.p,x:q.x};
      persistRun(true);
      next(); closing=false;
    }
    function tally(){
      const rows=paper.map((q,i)=>answers[i]||{id:q.id,ok:false,cat:q.cat,p:q.p,x:q.x});
      correct=rows.filter(r=>r.ok).length;
      missed=rows.filter(r=>!r.ok).map(r=>({id:r.id,p:r.p,x:r.x}));
      byCat={};
      rows.forEach(r=>{ byCat[r.cat]=byCat[r.cat]||{ok:0,n:0}; byCat[r.cat].n++; if(r.ok) byCat[r.cat].ok++; });
      return paper.length?Math.round(correct/paper.length*100):0;
    }
    async function finish(){
      stopTick(); done=true;
      const pct=tally();
      const item={id:Date.now().toString(36),name:state.display,model,mode,percent:pct,ok:correct,n:paper.length,date:new Date().toISOString()};
      state.history=[item,...state.history].slice(0,50);
      if(mode==="exam"){
        const n=examSession||1;
        const prev=examRec(n)||{attempts:0};
        if(n===2) delete state.unlock[lockKey(state.surname, model, 2)];
        const rec={surname:norm(state.surname),display:state.display,model,exam:n,percent:pct,at:item.date,attempts:(prev.attempts||0)+1,status:"done"};
        const sn=norm(state.surname);
        if(state.runs && state.runs[sn]) state.runs[sn].status="done";
        state.lastCode=packResult(rec); save();
        await upsertLock(rec);
        if(state.runs) delete state.runs[sn];
      }
      save(); render();
    }
    function next(){ if(idx+1>=paper.length) finish(); else { idx++; selected=[]; locked=false; qDeadline=Date.now()+QSEC*1000; left=QSEC; persistRun(true); render(); } }
    function bind(){

        }
        state.surname=sn; state.display=v.replace(/\s+/g," "); state.authed=true; save();
        if(userRun()){ resumeExam(userRun()); return; }
        view="hub"; state.section="hub"; render();
      };
      ["surname","loginPin"].forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); if(doLogin) doLogin.click(); } });
      });
      const logout=document.getElementById("logout");
      if(logout) logout.onclick=()=>{ persistRun(true); stopTick(); state.surname=""; state.display=""; state.authed=false; save(); view="login"; paper=[]; mode="exam"; done=false; render(); };
      document.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>{ examSession=Number(b.dataset.exam)||1; window._wantExam=examSession; view="quiz"; render(); });
      document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ studyTab=b.dataset.tab; render(); });
      document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{ rateModel=b.dataset.rate; render(); });
      const se=document.getElementById("startExam");
      if(se) se.onclick=()=>start("exam", "all", Number(se.dataset.n)||examSession||1);
      document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
        if(locked) return;
        const id=b.dataset.opt; const q=paper[idx];
        if(q.type==="single") selected=[id];
        else selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];
        if(mode==="exam") persistRun(false);
        render();
      });
      const ans=document.getElementById("answer");
      if(ans) ans.onclick=()=>{
        const q=paper[idx]; const ok=okNow(q);
        if(mode==="practice"){
          if(answers[idx]==null) answers[idx]={id:q.id,ok:!!ok,cat:q.cat,p:q.p,x:q.x};
          locked=true; render();
        } else commitAndNext(ok);
      };
      const nq=document.getElementById("nextQ");
      if(nq) nq.onclick=next;
      const uh=document.getElementById("unlockHome");
      if(uh) uh.onclick=()=>tryUnlock((document.getElementById("pinHome")||{}).value);
      const ub=document.getElementById("unlockBrief");
      if(ub) ub.onclick=()=>tryUnlock((document.getElementById("pinBrief")||{}).value);
      const sn=document.getElementById("syncNow");
      if(sn) sn.onclick=async()=>{ await refreshLocks(); render(); };
      const im=document.getElementById("importNow");
      if(im) im.onclick=async()=>{
        try{
          const rec=unpackResult((document.getElementById("importCode")||{}).value||"");
          if(!rec || !rec.surname || rec.percent==null) throw new Error("Пустой код");
          rec.status="done";
          await upsertLock(rec);
          pinErr="";
          await refreshLocks();
          render();
        }catch(e){ pinErr="Не удалось прочитать код."; render(); }
      };
      const uhi=document.getElementById("unlockHist");
      if(uhi) uhi.onclick=()=>tryUnlock((document.getElementById("pin")||{}).value);
    }
    try { render(); }
    catch(e){
      const root=document.getElementById("app");
      if(root) root.innerHTML="<p>Сбой запуска. Обновите страницу.</p>";
    }
    document.addEventListener("visibilitychange", ()=>{
      if(document.hidden){ persistRun(false); return; }
      if(inExam()){ catchUp(); if(!done) render(); }
    });
    window.addEventListener("pagehide", ()=>{ persistRun(true); });
    refreshLocks().then(()=>{
      if(state.authed && state.surname && userRun() && !done){ resumeExam(userRun()); return; }
      if(view==="home"||view==="rate"||view==="hub") render();
    }).catch(()=>{});
    if(state.authed && state.surname && userRun() && !done && !paper.length) resumeExam(userRun());
  </script>
</body>
</html>
