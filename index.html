  <style>
:root {
  --bg:#f4f1ea;
  --fg:#111114;
  --muted:#5c5a54;
  --surface:#fffcf7;
  --border:#e4dfd4;
  --primary:#c81e2b;
  --primary-ink:#fff;
  --pass:#1f7a4d;
  --ok-bg:#e8f6ee;
  --bad-bg:#fdecee;
  --shadow:0 1px 0 rgba(17,17,20,.04), 0 12px 40px rgba(17,17,20,.06);
  --radius:14px;
}
* { box-sizing:border-box; }
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.011em;}
button,[role=button]{cursor:pointer;font-family:inherit;}
button:disabled{cursor:not-allowed;opacity:.4;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 56px;}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(10px);padding:10px 0 12px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase;}
.mark{width:28px;height:28px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;border-radius:7px;font-weight:800;}
nav.desk{display:flex;flex-wrap:wrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
nav.desk button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;}
nav.desk button.on{background:var(--fg);color:#fff;}
nav.bot{display:none!important;}
.eyebrow{letter-spacing:.22em;color:var(--primary);font-size:11px;text-transform:uppercase;margin:0 0 8px;font-weight:700;}
h1{font-size:clamp(36px,7vw,64px);line-height:.92;margin:0;letter-spacing:-.04em;font-weight:800;}
h1 span{display:block;color:var(--muted);font-weight:600;}
h2{letter-spacing:-.02em;margin:0;font-weight:700;}
.lead{color:var(--muted);line-height:1.55;max-width:440px;font-size:15px;}
.grid2{display:grid;gap:14px;margin-top:24px;}
.card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:left;}
.card h3{font-size:22px;margin:8px 0 6px;letter-spacing:-.03em;}
.card p{color:var(--muted);font-size:14px;line-height:1.5;margin:0;}
label.field{display:block;max-width:340px;margin-top:18px;}
label.field span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;}
input,textarea{width:100%;background:#fff;border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:12px;font:15px Inter,sans-serif;}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:28px;}.actions>*{width:100%;}
.models{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
@media(min-width:720px){.grid2{grid-template-columns:1.1fr .9fr;}.actions{display:flex;flex-direction:column;}}
.rank{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.rank b{font-size:16px;}
.rank.guest,.rank.head{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px;align-items:center;gap:8px;}
.rank.head{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:8px;}
.rank.head span:nth-child(2),.rank.head span:nth-child(3),.rank.guest .pct{text-align:right;}
.rank .place-n{width:28px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;}
.pct{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;letter-spacing:-.04em;white-space:nowrap;}
.empty{color:var(--muted);padding:8px 0;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:8px 0 6px;min-height:210px;}
.pod{flex:1;max-width:200px;text-align:center;min-width:0;}
.pod .who{font-weight:800;font-size:14px;letter-spacing:-.02em;margin:0 0 8px;line-height:1.2;word-break:break-word;}
.pod .who span{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}
.pod .step{border-radius:12px 12px 4px 4px;padding:14px 8px 12px;color:#fff;}
.pod.p1 .step{min-height:128px;background:linear-gradient(180deg,#f0d36a,#c9a227);}
.pod.p2 .step{min-height:96px;background:linear-gradient(180deg,#d7dce2,#8b929a);}
.pod.p3 .step{min-height:76px;background:linear-gradient(180deg,#e0b07a,#b87333);}
.pod .place{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.9;}
.pod .score{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-top:6px;}
.pod.ghost .who{color:var(--muted);font-weight:600;}
.pod.ghost .step{background:#efeae0;color:var(--muted);min-height:64px;}
.banner{min-height:150px;border:1px solid var(--border);border-radius:20px;margin-top:8px;background:radial-gradient(1200px 200px at 100% 0,#f7d7d9 0,transparent 50%),linear-gradient(180deg,#fff,#f3efe6);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px;box-shadow:var(--shadow);}
.banner b{font-size:28px;letter-spacing:-.03em;}
.banner-name{font-size:clamp(40px,8vw,64px);line-height:.85;letter-spacing:-.06em;font-weight:800;color:#161618;}
.card.ok{border-color:#9ad4b4;background:var(--ok-bg);}
.card.bad{border-color:#f0b4b8;background:var(--bad-bg);}
.tabs{display:flex;flex-wrap:wrap;gap:0;border:0;background:transparent;border-bottom:1px solid var(--border);border-radius:0;padding:0;width:100%;margin:18px 0 8px;}
.tabs button{border:0;background:transparent;color:var(--muted);border-radius:0;padding:10px 16px 12px;font-weight:600;font-size:14px;position:relative;}
.tabs button.on{background:transparent;color:var(--fg);}
.tabs button.on:after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;background:var(--primary);}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;}
.btn.ivory{background:var(--primary);color:#fff;}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border);}
.bar{height:3px;background:#e8e5de;border-radius:99px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--primary);width:0;}
.opt{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:12px;padding:13px;display:flex;gap:10px;margin:8px 0;font-weight:500;}
.opt.on{border-color:var(--primary);background:#fff5f5;}
.opt.good{border-color:var(--pass);background:var(--ok-bg);}
.opt.bad{border-color:var(--primary);background:var(--bad-bg);}
.explain{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;font-size:14px;line-height:1.5;background:var(--surface);}
.clock{font-variant-numeric:tabular-nums;font-size:28px;font-weight:800;letter-spacing:-.04em;}
.clock.warn{color:var(--primary);}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg);}
.study-pick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;}
.study-pick .chip{flex:0 0 auto;white-space:nowrap;}
.rate-board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px;padding-bottom:0;}
.rate-col{min-width:0;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:10px 8px 8px;box-shadow:var(--shadow);}.rate-col h3{font-size:15px;margin:0 0 8px;}.rate-col-avg .rate-head,.rate-col-avg .rate-person,.rate-col-avg .rate-avg{grid-template-columns:minmax(0,1fr) 40px;}.rate-person b{font-size:13px;}
.rate-col .eyebrow{margin-bottom:2px;}
.rate-col h3{font-size:17px;margin:0 0 10px;letter-spacing:-.03em;}
.rate-head,.rate-person{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;gap:4px;align-items:center;}.rate-person .pct.span2{grid-column:2/4;text-align:center;}
.rate-head{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 0 6px;border-bottom:1px solid var(--border);}
.rate-head span:nth-child(2),.rate-head span:nth-child(3),.rate-person .pct{text-align:right;}
.rate-person{padding:8px 0;border-bottom:1px solid var(--border);}
.rate-person b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rate-person p{margin:0;font-size:11px;color:var(--muted);line-height:1.3;}
.rate-person .pct{font-size:14px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;}
.rate-person .pct.ok{color:var(--pass);}
.rate-person .pct.low{color:var(--primary);}
.rate-split{margin:10px 0 4px;border:0;border-top:1px solid var(--fg);padding-top:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;}.rate-avg{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;gap:4px;align-items:center;margin:8px 0 2px;padding:8px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);}.rate-avg b{font-size:12px;font-weight:700;color:var(--muted);}.rate-avg .pct{text-align:right;font-size:14px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.rate-col .empty{font-size:12px;padding:6px 0 4px;}

.model-card .car{display:none;}
.models{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
.model-row{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  margin-top:18px;
}
.models .card,
.model-card{
  position:relative;
  display:flex;
  flex-direction:column;
  padding:0;
  overflow:hidden;
  min-height:0;
  text-align:left;
  background:#fffcf7;
}
.models .card::before,
.model-row .card::before{
  content:"";
  display:block;
  width:100%;
  aspect-ratio:16/10;
  background-color:#efeae0;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
  border-bottom:1px solid var(--border);
}
.model-row .card::before{aspect-ratio:4/5;}
.models .card::after{content:none!important;display:none!important;}
.models .card[data-model="t4l"]::before,
.model-row .card[data-model="t4l"]::before{background-image:url("cars/t4l.jpg"),url("https://img.perxis.ru/unsafe/960x600/filters:format(jpeg):quality(78)/chry/originals/d7p04gqto5r7ch3usvi0/original");}
.models .card[data-model="t7"]::before,
.model-row .card[data-model="t7"]::before{background-image:url("cars/t7.jpg?v=3");background-position:40% 50%;}
.models .card[data-model="t8"]::before,
.model-row .card[data-model="t8"]::before{background-image:url("cars/t8.jpg?v=3");background-position:52% 55%;}
.models .card[data-model="t9"]::before,
.model-row .card[data-model="t9"]::before{background-image:url("cars/t9.jpg"),url("https://img.perxis.ru/unsafe/960x600/filters:format(jpeg):quality(78)/chry/originals/d9avnv2to5r6hlpdspfg/original");}
.models .card[data-model="a8"]::before,
.model-row .card[data-model="a8"]::before{background-image:url("cars/a8.jpg"),url("https://img.perxis.ru/unsafe/960x600/filters:format(jpeg):quality(78)/chry/originals/d9avncqto5r6hlpdspeg/original");}
.models .card .txt,
.model-row .card .txt{
  position:relative;
  z-index:1;
  max-width:none;
  padding:12px 12px 14px;
}
.models .card .eyebrow,
.model-row .card .eyebrow{margin:0 0 4px;}
.models .card h3{margin:0 0 6px;font-size:20px;}
.model-row .card h3{margin:0 0 4px;font-size:16px;letter-spacing:-.03em;}
.models .card p,
.model-row .card p{max-width:none;}
.model-row .card p{
  font-size:12px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.models .card:hover,
.model-row .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(17,17,20,.08);}
.model-row .card.is-on{border-color:#161618;}
@media (max-width:820px){
  .model-row{
    display:flex;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:6px;
  }
  .model-row .card{flex:0 0 168px;}
}
.hidden{display:none!important;}
.study-body p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 10px;}
.study-body ul{margin:0 0 12px;padding:0 0 0 18px;color:var(--muted);font-size:14px;line-height:1.55;}
.study-body li{margin:5px 0;}
.study-body b,.study-body strong{color:var(--fg);font-weight:700;}
.study-body h3{font-size:15px;margin:14px 0 8px;letter-spacing:-.02em;}
.study-body h3:first-child{margin-top:0;}
.docs{display:grid;gap:10px;}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.doc h3{margin:4px 0 6px;font-size:18px;}
.doc .meta{color:var(--muted);font-size:13px;margin:0;line-height:1.4;}
.doc .acts{display:flex;gap:8px;flex-wrap:wrap;}
.doc-strip{display:grid;gap:8px;margin-top:16px;}
.doc-mini{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;}
.doc-mini b{font-size:13px;}
.doc-mini span{color:var(--muted);}
.doc-mini a{font-weight:700;border-bottom:1px solid var(--border);}
.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;}
@media(min-width:900px){.hub-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}}
.hub-card{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  padding:0;
  overflow:hidden;
  min-height:0;
  text-align:left;
  background:#fffcf7;
}
.hub-card::before{
  content:"";
  display:block;
  width:100%;
  aspect-ratio:16/10;
  background-color:#efeae0;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
  border-bottom:1px solid var(--border);
}
.hub-card[data-go="home"]::before{background-image:url("hub/attest.jpg?v=2");background-position:50% 55%;}
.hub-card[data-go="terms"]::before{background-image:url("hub/terms.jpg?v=1");background-position:55% 42%;}
.hub-card[data-go="calc"]::before{background-image:url("hub/calc.jpg?v=1");background-position:38% 48%;}
.hub-card[data-go="stock"]::before{background-image:url("hub/stock.jpg?v=3");background-position:50% 58%;}
.hub-card[data-go="docs"]::before{background-image:url("hub/docs.jpg?v=1");background-position:50% 50%;}
.hub-card[data-go="epts"]::before{background-image:url("hub/epts.jpg?v=5");background-position:50% 48%;background-size:cover;}
.hub-card[data-go="gibdd"]::before{background-image:url("hub/gibdd.jpg?v=5");background-position:50% 50%;background-size:cover;}
.hub-card[data-go="duty"]::before{background-image:url("hub/duty.jpg?v=5");background-position:50% 48%;background-size:cover;}
.hub-card[data-go="tune"]::before{background-image:url("hub/tune.jpg?v=1");background-position:50% 62%;background-size:cover;}
.hub-card[data-go="board"]::before{background-image:url("hub/board.jpg?v=2");background-position:50% 62%;background-size:cover;}
.hub-card[data-go="senior"]::before{background-image:url("hub/senior.jpg?v=1");background-position:50% 62%;background-size:cover;}
.smop-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.smop-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.smop-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.smop-day{min-height:46px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:4px 5px;text-align:left;color:inherit}
.smop-day b{font-size:14px;font-variant-numeric:tabular-nums}
.smop-day.off{background:transparent;border-color:transparent;color:#b7b1a6;min-height:46px}
.smop-day.pad{border-color:transparent;background:transparent;pointer-events:none}
.smop-day.today{background:#f4efe6}
.smop-day.on{border-color:#1c3f66;box-shadow:inset 0 0 0 1px #1c3f66}
.smop-dots{display:flex;gap:3px;min-height:5px;margin-top:4px}
.smop-dots i{width:5px;height:5px;border-radius:50%;display:block;background:#1c3f66}
.smop-dots i.w{background:#c28b2a}
.smop-dots i.m{background:#6a3d86}
.smop-legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:8px;color:var(--muted);font-size:12px}
.smop-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.smop-blocks{display:grid;gap:10px;margin-top:12px}
.smop-task{padding:8px 0;border-top:1px solid var(--border)}
.smop-task:first-of-type{border-top:0}
.smop-task b{display:block;font-size:14px}
.smop-task p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
.smop-task.hit{background:#f6f3fb;margin:0 -10px;padding:8px 10px;border-radius:10px;border-top-color:transparent}
.smop-line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.smop-line p{margin:3px 0 0}
.smop-tick,.smop-time,.smop-meet{border:1px solid var(--border);background:#fff;border-radius:10px;color:inherit;font-weight:700}
.smop-tick{min-width:64px;padding:8px 12px}
.smop-tick.on,.smop-time.on,.smop-meet.done{background:#e8f6ee;border-color:#1f7a4d;color:#1f7a4d}
.smop-meet.plan{background:#fff6df;border-color:#c28b2a;color:#8a5a10}
.smop-meet.skip{background:#fdecee;border-color:#c81e2b;color:#c81e2b}
.smop-stage{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;text-align:left;max-width:100%}
.smop-stage.s1{background:#fff6df;border-color:#c28b2a;color:#8a5a10}
.smop-stage.s2{background:#eef3fb;border-color:#1c3f66;color:#1c3f66}
.smop-stage.s3{background:#e8f6ee;border-color:#1f7a4d;color:#1f7a4d}
.smop-times,.smop-meets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.smop-time{padding:8px 12px}
.smop-meet{padding:6px 8px;min-width:58px}
.smop-meet small,.smop-time small{display:block;font-size:10px;font-weight:600}
.smop-stand{margin-top:12px}
@media(min-width:900px){.smop-blocks{grid-template-columns:1fr 1fr 1fr;align-items:start}}
.lb-row.other{background:#fbf7f1}
.lb-row.other td{color:#6d6458}
.tune-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
.tune-scroll{overflow-x:auto;margin-top:8px;}
.tune-table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px;}
.tune-table th,.tune-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tune-table th:first-child,.tune-table td:first-child{text-align:left;font-variant-numeric:normal;white-space:normal;min-width:220px;}
.tune-table th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.tune-table tr.grp td{background:#f6f1e8;font-weight:800;text-align:left;color:#161618;}

        days=new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
        passed=Math.min(days, Math.max(1, now.getDate()));

    }
    function smopHas(o){
      return ["days","meet","ssi","sched","test","once"].some(k=>o && o[k] && Object.keys(o[k]).length);
    }
    function smopLeaf(remoteNode, beforeNode, afterNode){
      const obj=v=>v && typeof v==="object" && !Array.isArray(v);
      if(obj(afterNode) || obj(beforeNode)){
        const out=obj(remoteNode)?Object.assign({}, remoteNode):{};
        const keys=new Set(Object.keys(beforeNode||{}).concat(Object.keys(afterNode||{})));
        keys.forEach(k=>{
          const bv=beforeNode?beforeNode[k]:undefined;
          const av=afterNode?afterNode[k]:undefined;
          if(JSON.stringify(bv)===JSON.stringify(av)) return;
          out[k]=(obj(av)||obj(bv))?smopLeaf(out[k], bv, av):av;
        });
        return out;
      }
      return afterNode;
    }
    async function smopPull(){
      const r=await withTimeout(fetch("https://rentry.co/api/fetch/"+SMOP_CLOUD_ID,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body: cloudForm({edit_code: SMOP_CLOUD_KEY})
      }), 8000);
      if(!r || !r.ok) throw new Error("smop");
      const data=await r.json();
      const text=(data && data.content && data.content.text) || "{}";
      const parsed=JSON.parse(text||"{}");
      return parsed && typeof parsed==="object" ? parsed : {};
    }
    async function smopPush(o){
      const r=await withTimeout(fetch("https://rentry.co/api/edit/"+SMOP_CLOUD_ID,{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body: cloudForm({edit_code: SMOP_CLOUD_KEY, text: JSON.stringify(o)})
      }), 8000);
      if(!r || !r.ok) throw new Error("smop edit");
      const out=await r.json().catch(()=>({status:"200"}));
      if(String(out.status)!=="200") throw new Error("smop status");
    }
    async function smopCommit(before, after){
      let remote={};
      try{ remote=await smopPull(); }catch(e){ remote=smopLoad(); }
      const merged=smopLeaf(remote, before, after);
      merged.rev=Date.now();
      await smopPush(merged);
      smopSave(merged);
      smopCloudOk=true;
    }
    function smopPatch(fn){
      const before=smopLoad();
      const after=JSON.parse(JSON.stringify(before));
      fn(after);
      smopSave(after);
      render();
      smopWrites++;
      smopSyncing=smopSyncing.then(async()=>{
        try{ await smopCommit(before, after); }
        catch(e){ smopCloudOk=false; }
        smopWrites=Math.max(0, smopWrites-1);
        if(view==="senior" && smopWrites===0) render();
      }).catch(()=>{ smopWrites=Math.max(0, smopWrites-1); });
    }
    async function smopRefresh(){
      if(view!=="senior" || smopWrites>0 || smopPulling) return;
      smopPulling=true;
      const stamp=smopWrites;
      try{
        const local=smopLoad();
        const remote=await smopPull();
        if(smopWrites!==stamp) return;
        const was=smopCloudOk;
        smopCloudOk=true;
        if(!smopHas(remote) && smopHas(local)){
          local.rev=Date.now();
          await smopPush(local);
          smopSave(local);
          if(was!==true && view==="senior" && smopWrites===0) render();
          return;
        }
        if((remote.rev||0)>=(local.rev||0) && JSON.stringify(remote)!==JSON.stringify(local)){
          smopSave(remote);
          if(view==="senior" && smopWrites===0) render();
        } else if(was!==true && view==="senior" && smopWrites===0) render();
      }catch(e){
        const was=smopCloudOk;
        smopCloudOk=false;
        if(was!==false && view==="senior" && smopWrites===0) render();
      }finally{

    }

    function fleetMonthsLeft(principal, payment, annual){
      if(!(principal>0)) return 0;
      const r=(Number(annual)||0)/100/12;
      const p=Number(payment)||0;
      if(!(p>0)) return null;
      if(r<=0) return Math.ceil(principal/p);
      if(p<=principal*r+1e-6) return null;
      const n=Math.log(p/(p-principal*r))/Math.log(1+r);
      const months=Math.ceil(n-1e-6);
      return months<1?1:months;
    }

      base=Math.max(0, Math.round(Number(base)||0));
      sub=Math.max(0, Math.min(base, Math.round(Number(sub)||0)));
      const price=Math.max(0, base-sub);
      const want=Math.max(0, Math.round(Number(down)||0));
      const doCasco=Math.max(0, Math.round(Number(doAmt)||0))+Math.max(0, Math.round(Number(cascoAmt)||0));
      const cap49=Math.round(base*0.49);
      const maxPv=Math.max(0, cap49-sub);
      const earlyCap=Math.round(base*0.25);
      const limited=!!limitPv && sub>0;
      let pv, early=0, earlyOver=0;
      if(limited){
        pv=Math.min(want, maxPv);
        const raw=Math.max(0, want-pv);
        early=Math.min(raw, earlyCap);
        earlyOver=raw-early;
      }else pv=Math.min(want, price+doCasco);
      const pvExtras=Math.min(pv, doCasco);
      const pvCar=Math.max(0, pv-pvExtras);
      const extrasCredit=Math.max(0, doCasco-pvExtras);
      const credit=Math.max(0, price-pvCar+extrasCredit);
      const term=Math.min(Math.max(1, Math.round(Number(months)||84)), 84);
      const given=Number(rateIn);
      const rate=Number.isFinite(given)&&given>0?given:19.2;
      const pay=typeof calcPay==="function"?calcPay(credit+pvCar, pvCar, term, rate):0;

      if(early>0){
        const left=Math.max(0, credit-early);
        const n=fleetMonthsLeft(left, pay, rate);
        termAfter=n==null?term:Math.min(term, n);
      }
      const owe=Math.max(0, credit-early);
      const over=termAfter>0?pay*termAfter-owe:0;
      return {base, sub, price, cap49, maxPv, earlyCap, limited, pv, early, earlyOver, doCasco, pvExtras, pvCar, extrasCredit, credit, term, termAfter, rate, pay, over};
    }

    function stockTrimGroups(rows){

      });
      const groups=Object.keys(map).map(trim=>({trim, rows:map[trim].slice().sort(stockCmp)}));
      const dir=(typeof stockSortDir==="number"?stockSortDir:1)||1;
      const key=(typeof stockSort==="string"&&stockSort)||"trim";
      groups.sort((A,B)=>{

      };

        let d=0;
        if(key==="price") d=nums(a,stockRrc,"min")-nums(b,stockRrc,"min");

      return `<select id="${id}" class="of-select">${groups}</select>`;

    function offerJpeg(canvas){
      const bin=atob(canvas.toDataURL("image/jpeg", 0.86).split(",")[1]);

    function offerPdfBytes(images){
      const enc=new TextEncoder();
      const chunks=[];
      let len=0;
      function add(x){
        if(typeof x==="string") x=enc.encode(x);
        chunks.push(x);
        len+=x.length;
      }
      const offsets=[0];
      function objStart(){
        offsets.push(len);
        add((offsets.length-1)+" 0 obj\n");
      }
      function objEnd(){ add("\nendobj\n"); }
      add("%PDF-1.4\n");
      const n=images.length;
      objStart();
      add("<< /Type /Catalog /Pages 2 0 R >>");
      objEnd();
      objStart();
      const kids=[];
      for(let i=0;i<n;i++) kids.push((3+i*3)+" 0 R");
      add("<< /Type /Pages /Count "+n+" /Kids ["+kids.join(" ")+"] >>");
      objEnd();
      images.forEach(im=>{
        const contentId=offsets.length+1;
        const imageId=offsets.length+2;
        objStart();
        add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Contents "+contentId+" 0 R /Resources << /XObject << /Im0 "+imageId+" 0 R >> >> >>");
        objEnd();
        const content="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q\n";
        objStart();
        add("<< /Length "+content.length+" >>\nstream\n"+content+"endstream");
        objEnd();
        objStart();
        add("<< /Type /XObject /Subtype /Image /Width "+im.w+" /Height "+im.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+im.jpeg.length+" >>\nstream\n");
        add(im.jpeg);
        add("\nendstream");
        objEnd();
      });
      const start=len;
      const size=offsets.length;
      let xref="xref\n0 "+size+"\n0000000000 65535 f \n";
      for(let i=1;i<size;i++) xref+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
      add(xref);
      add("trailer\n<< /Size "+size+" /Root 1 0 R >>\nstartxref\n"+start+"\n%%EOF");
      const out=new Uint8Array(len);
      let o=0;
      chunks.forEach(ch=>{ out.set(ch, o); o+=ch.length; });
      return out;
    }

      return `<div class="card"><p class="eyebrow">Прайс тюнинг</p><h3 style="margin:4px 0 8px">Дополнительное оборудование</h3><p class="tune-note">Суммы как в файле. Столбец Tiggo 9 — это Tenet T9 из прайса. Прочерк — этой позиции нет у модели.</p><div class="tune-scroll"><table class="tune-table">${head}${body}</table></div></div>`;
    }
    function tuneRubberHtml(key){
      const pack=TUNE_RUBBER[key];
      const titles={chery:"Зимняя резина Chery / TENET"};
      const head="<tr><th>Позиция</th><th>1 шт</th><th>Комплект</th><th>"+escape(pack.stock)+"</th></tr>";
      const groups=pack.groups.concat([["Шиномонтаж", pack.mount.map(([s,n])=>["Комплексный "+s,n,null,"—"])]]);
      const body=groups.map(([g,rows])=>{
        const title=`<tr class="grp"><td colspan="4">${escape(g)}</td></tr>`;
        const lines=rows.map(r=>{
          const one=typeof r[1]==="number"?tuneMoney(r[1]):escape(String(r[1]==null?"—":r[1]));
          const set=typeof r[2]==="number"?tuneMoney(r[2]):"—";
          const stock=escape(String(r[3]==null?"—":r[3]));
          return "<tr><td>"+escape(r[0])+"</td><td>"+one+"</td><td>"+set+"</td><td>"+stock+"</td></tr>";
        }).join("");
        return title+lines;
      }).join("");
      const notes=(pack.notes||[]).map(t=>"<p class=\"tune-note\">"+escape(t)+"</p>").join("");
      return `<div class="card"><p class="eyebrow">Резина</p><h3 style="margin:4px 0 8px">${escape(titles[key]||"Резина")}</h3><p class="tune-note">Суммы как в файле. Прочерк — в файле цены нет.</p><div class="tune-scroll"><table class="tune-table">${head}${body}</table></div>${notes}</div>`;
    }
    function tune(){
      if(needAuth()) return login();
      if(tuneTab!=="do" && tuneTab!=="chery") tuneTab="chery";
      const tabs=[["do","Тюнинг"],["chery","Резина"]];
      const bar=tabs.map(([id,l])=>`<button type="button" class="btn ${tuneTab===id?"ivory":"ghost"}" data-tune="${id}">${l}</button>`).join("");
      const body=tuneTab==="do"?tuneDoHtml():tuneRubberHtml(tuneTab);
      return banner("Тюнинг и резина","Прайс тюнинг и файл «Резина Чери»","TENET")+`
        <div class="tune-tabs">${bar}</div>
        ${body}`;
    }

          const list=DOCS[m.id]||[];
          return `<div class="card" style="margin-top:12px">
            <div class="eyebrow">${escape(m.brand)}</div>
            <h3 style="margin:4px 0 8px">${escape(m.name)}</h3>

              const isArg=/аргумент|тренинг|материал/i.test(d.kind||"");
              const locked=isArg && !unlocked;

                <b>${escape(d.title)}</b>
                <span>${escape(d.kind)} · ${escape(d.pages)}</span>
                ${locked?`<span>После аттестации №1</span>`:`<a href="${d.file}" target="_blank" rel="noopener">Открыть</a><a href="${d.file}" download>Скачать</a>`}
              </div>`;
            }).join("")}
          </div>`;
        }).join("")}`;
    }

    const EPTS_CC=["Daria.Lukina@tenet.ru","Ejukavina@vip-avto.ru","credit@vip-avto.ru","aleontiev@chery-vipauto.ru"];

    const EPTS_TO_WEEKEND="team.elpts@chery.ru";
    const EPTS_PREFIX=[
      ["EDELB31","t4l"],["EDEEB31","t4l"],

    function eptsCleanVin(v){
      return String(v||"").toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,"").slice(0,17);
    }
    function eptsMoscowNow(){
      const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
      const g=t=>Number(parts.find(p=>p.type===t).value);
      return {y:g("year"),m:g("month"),d:g("day")};
    }
    function eptsUtcDate(y,m,d){ return new Date(Date.UTC(y,m-1,d)); }
    function eptsDow(dt){ return dt.getUTCDay(); }
    function eptsIsWeekend(dt){ const d=eptsDow(dt); return d===0||d===6; }
    function eptsFmt(dt){
      const dd=String(dt.getUTCDate()).padStart(2,"0");
      const mm=String(dt.getUTCMonth()+1).padStart(2,"0");
      return dd+"."+mm+"."+dt.getUTCFullYear();
    }
    function eptsAddDays(dt,n){ const x=new Date(dt.getTime()); x.setUTCDate(x.getUTCDate()+n); return x; }
    function eptsPayBy(issued){
      let d=new Date(issued.getTime());
      if(eptsIsWeekend(d)){
        while(eptsIsWeekend(d)) d=eptsAddDays(d,1);
      }
      let count=1;
      while(count<3){
        d=eptsAddDays(d,1);
        if(!eptsIsWeekend(d)) count++;
      }
      return d;
    }
    function eptsMailPack(draft){
      const weekend=eptsIsWeekend(draft.issuedDt);
      const vin=draft.vin;
      const pay=draft.payBy;
      const line="Прошу согласовать передачу ЭПТС для заключения договора с клиентом. Оплата до "+pay+", отзывных нет, гарантийное письмо во вложении.";
      const who=weekend?"Коллеги, добрый день! ":"Антон, добрый день! ";
      return {
        weekend,
        to: weekend?EPTS_TO_WEEKEND:EPTS_TO_WORK,
        cc: (weekend?[EPTS_TO_WORK]:[]).concat(EPTS_CC).join(", "),
        subj: "ЭКСПЕРТ АВТО САМАРА_ЭПТС VIN "+vin,
        body: who+line+"\n\nVIN "+vin,
        label: weekend?"Выходной · team.elpts@chery.ru":"Рабочий день · Anton.Kokhanov@tenet.ru"
      };
    }
    function eptsLetterName(id, fallback){
      if(id==="t4l") return "TENET Т4L";
      if(id==="t7") return "TENET Т7";
      if(id==="t8") return "TENET Т8";
      if(id==="tt9") return "TENET T9";
      if(id==="t9") return "CHERY Tiggo 9";
      if(id==="a8") return "CHERY Arrizo 8";
      const m=MODELS[id];
      if(m) return m.brand+" "+m.name;
      return fallback||"TENET";
    }
    function eptsLookup(vinRaw){
      const vin=eptsCleanVin(vinRaw);
      if(!vin) return {vin:"", ok:false};
      const stock=(typeof STOCK!=="undefined"?STOCK:[]).find(x=>String(x.vin||"").toUpperCase()===vin);
      if(stock){
        const m=MODELS[stock.model]||{};
        return {
          vin, ok:true, fromStock:true, model:stock.model,
          letter:eptsLetterName(stock.model, (m.brand||"TENET")+" "+(stock.name||"")),
          title:(m.brand||"TENET")+" "+(stock.name||""),
          trim:stock.trim||"", color:stock.color||"", note:stock.note||"", status:stock.status||""
        };
      }
      const pref=EPTS_PREFIX.find(([p])=>vin.startsWith(p));
      if(pref){
        const id=pref[1];
        const m=MODELS[id]||{};
        return {
          vin, ok:true, fromStock:false, model:id,
          letter:eptsLetterName(id),
          title:(m.brand||"")+" "+(m.name||id.toUpperCase()),
          trim:"", color:"", note:"Модель по префиксу VIN, в складе салона нет.", status:""
        };
      }
      if(eptsModel && MODELS[eptsModel]){
        const m=MODELS[eptsModel];
        return {
          vin, ok:vin.length>=11, fromStock:false, model:eptsModel,
          letter:eptsLetterName(eptsModel),
          title:m.brand+" "+m.name,
          trim:"", color:"", note:"Модель указана вручную.", status:""
        };
      }
      return {vin, ok:false, note:"VIN не найден. Выберите модель вручную."};
    }
    function eptsLookupHtml(vinRaw){
      const hit=eptsLookup(vinRaw);
      if(!hit.vin) return `<p class="lead" style="margin-top:12px">17 символов, латиница и цифры. Склад подставит модель сам.</p>`;
      if(!hit.ok && !hit.model){
        return `<div class="epts-found"><b>VIN не распознан</b><span>${escape(hit.note||"Выберите модель чипом ниже.")}</span></div>`;
      }
      const st=hit.status==="in"?"В наличии":hit.status==="way"?"В пути":hit.fromStock?"На складе":"Не на складе";
      return `<div class="epts-found">
        <b>${escape(hit.letter)} · ${escape(hit.vin)}</b>
        <span>${escape([hit.trim, hit.color, st, hit.note].filter(Boolean).join(" · "))}</span>
      </div>`;
    }
    function eptsLoadImg(src){
      return new Promise((resolve,reject)=>{
        const im=new Image();
        im.onload=()=>resolve(im);
        im.onerror=()=>reject(new Error(src));
        im.src=src;
      });
    }
    let eptsStamp=null, eptsSign=null;
    async function eptsEnsureImgs(){
      try{ await document.fonts.ready; }catch(e){}
      try{ await document.fonts.load("28px Tinos"); }catch(e){}
      if(eptsStamp && eptsSign) return;
      const [a,b]=await Promise.all([
        eptsLoadImg("epts/stamp.png").catch(()=>eptsLoadImg("epts/stamp.jpg")).catch(()=>eptsLoadImg(EPTS_STAMP_DATA)),
        eptsLoadImg("epts/sign.png").catch(()=>eptsLoadImg("epts/sign.jpg")).catch(()=>eptsLoadImg(EPTS_SIGN_DATA))
      ]);
      eptsStamp=a; eptsSign=b;
    }
    function eptsWrap(ctx, text, maxW){
      const words=String(text||"").split(/\s+/);
      const lines=[];
      let line="";
      for(const w of words){
        const t=line?line+" "+w:w;
        if(ctx.measureText(t).width<=maxW) line=t;
        else { if(line) lines.push(line); line=w; }
      }
      if(line) lines.push(line);
      return lines;
    }
    const eptsInkCache=typeof WeakMap==="function"?new WeakMap():null;
    function eptsInkBox(img){
      if(!img) return null;
      if(eptsInkCache && eptsInkCache.has(img)) return eptsInkCache.get(img);
      const c=document.createElement("canvas");
      c.width=img.width; c.height=img.height;

      g.drawImage(img,0,0);
      const data=g.getImageData(0,0,c.width,c.height).data;
      let minX=c.width,minY=c.height,maxX=0,maxY=0,found=0;
      for(let yy=0;yy<c.height;yy++){
        for(let xx=0;xx<c.width;xx++){
          const i=(yy*c.width+xx)*4;
          if(data[i+3]<18) continue;
          if(data[i]>246 && data[i+1]>246 && data[i+2]>246) continue;
          found++;
          if(xx<minX) minX=xx; if(xx>maxX) maxX=xx;
          if(yy<minY) minY=yy; if(yy>maxY) maxY=yy;
        }
      }
      const box=found?{x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1}:{x:0,y:0,w:img.width,h:img.height};
      if(eptsInkCache) eptsInkCache.set(img, box);
      return box;
    }

    function eptsJpegToPdf(jpeg, w, h){
      const pageW=595, pageH=842;
      const encoder=new TextEncoder();
      const chunks=[];
      const pushStr=s=>chunks.push(encoder.encode(s));
      const pushBytes=u=>chunks.push(u);
      const objects=[];
      const addObj=(bodyBytes)=>{
        objects.push(bodyBytes);
        return objects.length;
      };
      const cat=addObj(encoder.encode("<< /Type /Catalog /Pages 2 0 R >>"));
      const pages=addObj(encoder.encode("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
      const page=addObj(encoder.encode("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pageW+" "+pageH+"] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>"));
      const content="q "+pageW+" 0 0 "+pageH+" 0 0 cm /Im0 Do Q\n";
      const contentBytes=encoder.encode(content);
      const stream1=new Uint8Array(encoder.encode("<< /Length "+contentBytes.length+" >>\nstream\n").length+contentBytes.length+encoder.encode("\nendstream").length);
      const h1=encoder.encode("<< /Length "+contentBytes.length+" >>\nstream\n");
      const t1=encoder.encode("\nendstream");
      stream1.set(h1,0); stream1.set(contentBytes,h1.length); stream1.set(t1,h1.length+contentBytes.length);
      const cont=addObj(stream1);
      const imgHead=encoder.encode("<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpeg.length+" >>\nstream\n");
      const imgTail=encoder.encode("\nendstream");
      const imgBody=new Uint8Array(imgHead.length+jpeg.length+imgTail.length);
      imgBody.set(imgHead,0); imgBody.set(jpeg,imgHead.length); imgBody.set(imgTail,imgHead.length+jpeg.length);
      const img=addObj(imgBody);
      void cat; void pages; void page; void cont; void img;
      const header=encoder.encode("%PDF-1.4\n");
      const parts=[header];
      let offset=header.length;
      const xref=[0];
      objects.forEach((body,i)=>{
        xref.push(offset);
        const o=encoder.encode((i+1)+" 0 obj\n");
        const e=encoder.encode("\nendobj\n");
        parts.push(o, body, e);
        offset+=o.length+body.length+e.length;
      });
      const xrefStart=offset;
      let xrefStr="xref\n0 "+(objects.length+1)+"\n0000000000 65535 f \n";
      xref.slice(1).forEach(off=>{
        xrefStr+=String(off).padStart(10,"0")+" 00000 n \n";
      });
      xrefStr+="trailer << /Size "+(objects.length+1)+" /Root 1 0 R >>\nstartxref\n"+xrefStart+"\n%%EOF";
      parts.push(encoder.encode(xrefStr));
      let total=0; parts.forEach(p=>total+=p.length);
      const out=new Uint8Array(total);
      let p=0; parts.forEach(b=>{ out.set(b,p); p+=b.length; });
      return out;
    }
    async function eptsBuildPdf(draft){
      await eptsEnsureImgs();
      const canvas=document.createElement("canvas");
      eptsDrawLetter(canvas, draft);
      const dataUrl=canvas.toDataURL("image/jpeg",0.86);
      const bin=atob(dataUrl.split(",")[1]);
      const jpeg=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) jpeg[i]=bin.charCodeAt(i);
      const pdf=eptsJpegToPdf(jpeg, canvas.width, canvas.height);
      const blob=new Blob([pdf],{type:"application/pdf"});
      const url=URL.createObjectURL(blob);
      return {blob,url,bytes:pdf,preview:dataUrl,name:"EPTS-"+draft.vin+"-"+draft.issued.replace(/\./g,"")+".pdf"};
    }
    function eptsB64(bytes){
      let s="", chunk=0x8000;
      for(let i=0;i<bytes.length;i+=chunk){
        s+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
      }
      return btoa(s);
    }
    function eptsFoldB64(s){
      return s.replace(/(.{76})/g,"$1\r\n");
    }
    function eptsBuildEml(draft, pdf){
      const mail=eptsMailPack(draft);
      const to=draft.to||mail.to;
      const cc=draft.cc||mail.cc;
      const subj=draft.subj||mail.subj;
      const body=(draft.body||mail.body).replace(/\n/g,"\r\n");
      const filename=pdf.name;
      const bound="=_epts_"+Date.now().toString(36);
      const b64=eptsFoldB64(eptsB64(pdf.bytes));
      const eml=[
        "X-Unsent: 1",
        "MIME-Version: 1.0",
        "To: "+to,
        "Cc: "+cc,
        "Subject: =?UTF-8?B?"+btoa(unescape(encodeURIComponent(subj)))+"?=",
        "Content-Type: multipart/mixed; boundary=\""+bound+"\"",
        "",
        "--"+bound,
        "Content-Type: text/plain; charset=UTF-8",
        "Content-Transfer-Encoding: 8bit",
        "",
        body,
        "--"+bound,
        "Content-Type: application/pdf; name=\""+filename+"\"",
        "Content-Transfer-Encoding: base64",
        "Content-Disposition: attachment; filename=\""+filename+"\"",
        "",
        b64,
        "--"+bound+"--"
      ].join("\r\n");
      return new Blob([eml],{type:"message/rfc822"});
    }
    function eptsDownload(blob, name){
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=name;

      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);

    function dutyJpegPdf(jpeg,w,h){
      const pageW=595, pageH=842;
      const enc=new TextEncoder();
      const objects=[];
      const add=b=>{ objects.push(b); return objects.length; };
      add(enc.encode("<< /Type /Catalog /Pages 2 0 R >>"));
      add(enc.encode("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
      add(enc.encode("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pageW+" "+pageH+"] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>"));
      const content=enc.encode("q "+pageW+" 0 0 "+pageH+" 0 0 cm /Im0 Do Q\n");
      const h1=enc.encode("<< /Length "+content.length+" >>\nstream\n");
      const t1=enc.encode("\nendstream");
      const stream1=new Uint8Array(h1.length+content.length+t1.length);
      stream1.set(h1,0); stream1.set(content,h1.length); stream1.set(t1,h1.length+content.length);
      add(stream1);
      const imgHead=enc.encode("<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpeg.length+" >>\nstream\n");
      const imgTail=enc.encode("\nendstream");
      const imgBody=new Uint8Array(imgHead.length+jpeg.length+imgTail.length);
      imgBody.set(imgHead,0); imgBody.set(jpeg,imgHead.length); imgBody.set(imgTail,imgHead.length+jpeg.length);
      add(imgBody);
      const header=enc.encode("%PDF-1.4\n");
      const parts=[header];
      let offset=header.length;
      const xref=[0];
      objects.forEach((body,i)=>{
        xref.push(offset);
        const o=enc.encode((i+1)+" 0 obj\n");
        const e=enc.encode("\nendobj\n");
        parts.push(o, body, e);
        offset+=o.length+body.length+e.length;
      });
      let xrefStr="xref\n0 "+(objects.length+1)+"\n0000000000 65535 f \n";
      xref.slice(1).forEach(off=>{ xrefStr+=String(off).padStart(10,"0")+" 00000 n \n"; });
      xrefStr+="trailer << /Size "+(objects.length+1)+" /Root 1 0 R >>\nstartxref\n"+offset+"\n%%EOF";
      parts.push(enc.encode(xrefStr));
      let total=0; parts.forEach(p=>total+=p.length);
      const out=new Uint8Array(total);
      let p=0; parts.forEach(b=>{ out.set(b,p); p+=b.length; });
      return out;
    }
    function dutyFileSave(canvas, d){

      const bytes=new Uint8Array(bin.length);

      const blob=new Blob([bytes],{type:"image/png"});
      const name=dutyFileName(d);
      const fallback=()=>{
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download=name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      };
      if(window.showSaveFilePicker){
        showSaveFilePicker({suggestedName:name, startIn:"desktop", types:[{description:"PNG", accept:{"image/png":[".png"]}}]}).then(async handle=>{
          const w=await handle.createWritable();
          await w.write(blob);
          await w.close();
        }).catch(e=>{ if(!e || e.name!=="AbortError") fallback(); });
        return;
      }
      fallback();
    }

      function rr(x,y,w,h,r){

      const p=String(s||"").trim().split(/\s+/).filter(Boolean);
      return {last:p[0]||"", first:p[1]||"", mid:p.slice(2).join(" ")};
    }
    function gibddDob(s){
      const t=String(s||"").trim();
      const m=t.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/) || t.match(/^(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})$/);
      if(!m) return t;
      if(m[1].length===4) return ("0"+m[3]).slice(-2)+"."+("0"+m[2]).slice(-2)+"."+m[1];
      const y=m[3].length===2?("20"+m[3]):m[3];
      return ("0"+m[1]).slice(-2)+"."+("0"+m[2]).slice(-2)+"."+y;
    }
    function gibddMaskDob(el){
      const raw=String(el.value||"").replace(/\D/g,"").slice(0,8);
      let out=raw.slice(0,2);
      if(raw.length>2) out+="."+raw.slice(2,4);
      if(raw.length>4) out+="."+raw.slice(4,8);
      el.value=out;
    }

    function gibddLinks(form){
      const vin=String((form&&form.vin)||"").replace(/\s+/g,"").toUpperCase();
      const fio=String((form&&form.fio)||"").trim();
      const dob=gibddDob((form&&form.dob)||"");
      const nm=gibddSplitFio(fio);
      const fssp="https://fssp.gov.ru/iss/ip?is%5Blast_name%5D="+encodeURIComponent(nm.last)+
        "&is%5Bfirst_name%5D="+encodeURIComponent(nm.first)+

        "&is%5Bdate%5D="+encodeURIComponent(dob)+
        "&is%5Bregion_id%5D%5B0%5D=-1";
      const zalog="https://www.reestr-zalogov.ru/search/index?vin="+encodeURIComponent(vin);
      const bankrot="https://fedresurs.ru/bankrupts?searchString="+encodeURIComponent(fio);
      const bankrotOld="https://bankrot.fedresurs.ru/Debtors.search.aspx?Name="+encodeURIComponent(fio);

    function gibddCopy(text){

    async function gibddFetch(url){
      const ctrl=typeof AbortController==="function"?new AbortController():null;
      const t=setTimeout(()=>{ try{ if(ctrl) ctrl.abort(); }catch(e){} }, 8000);
      try{
        const r=await fetch(url,{signal:ctrl?ctrl.signal:undefined, cache:"no-store"});
        const text=await r.text();
        return {ok:r.ok, status:r.status, text:text.slice(0,12000)};
      }catch(e){
        return {ok:false, status:0, text:String(e&&e.message||e)};
      }finally{ clearTimeout(t); }
    }
    function gibddParseZalog(text, vin){
      const t=String(text||"");
      if(/ничего не найдено|не найдено уведомлен/i.test(t)) return {hit:false, n:0, detail:"Записей по VIN нет"};
      const recs=t.match(/20\d{2}-\d{3}-\d+/g)||[];
      if(recs.length) return {hit:true, n:recs.length, detail:"Найдены уведомления: "+recs.slice(0,6).join(", ")};
      return {hit:null, n:0, detail:"Нужна капча на сайте. VIN скопирован."};
    }
    function gibddParseFssp(text){
      const t=String(text||"");
      if(/Ничего не найдено|не найдено исполнительн/i.test(t)) return {hit:false, n:0, detail:"ИП не найдено"};
      const ips=t.match(/\d+\/\d+\/\d+-?И?П?/g)||[];
      if(ips.length) return {hit:true, n:ips.length, detail:"Найдены ИП: "+ips.slice(0,8).join(", ")};
      return {hit:null, n:0, detail:"ФССП просит капчу. Регион — Все. ФИО и дата в ссылке."};
    }
    function gibddParseBankrot(text, fio){
      const t=String(text||"");
      if(/ничего не найдено|не найдено сообщен/i.test(t)) return {hit:false, n:0, detail:"В реестре банкротов нет"};
      let recs=0;
      try{
        const j=JSON.parse(t);
        const arr=j.pageData||j.items||j.data||j.records||[];
        if(Array.isArray(arr)) recs=arr.length;
        if(j.total||j.totalCount) recs=Number(j.total||j.totalCount)||recs;
      }catch(e){
        const name=String(fio||"").split(/\s+/)[0];
        if(name && t.toLowerCase().includes(name.toLowerCase()) && /банкрот/i.test(t)) recs=1;
      }
      if(recs) return {hit:true, n:recs, detail:"Найдено записей: "+recs};
      return {hit:null, n:0, detail:"Откройте Федресурс — ФИО в поиске."};
    }
    function gibddVerdict(z,f,b){
      const bad=[];
      if(z&&z.hit) bad.push("залог");
      if(f&&f.hit) bad.push("ФССП");
      if(b&&b.hit) bad.push("банкротство");
      if(bad.length) return {ok:false, text:"Риск: "+bad.join(", ")};
      if([z,f,b].some(x=>x && x.hit===null)) return {ok:null, text:"Откройте реестры и пройдите капчу"};
      return {ok:true, text:"По автопроверке записей нет"};
    }
    async function gibddRun(){
      try{
        const form=gibddSaveForm();

        if(!L.vin || !L.nm.last || !L.nm.first || !L.dob){

        if(box) box.innerHTML=`<div class="note-box">Собираю сводку и ссылки с заполненными полями…</div>`;
        const [zRaw, fRaw, bRaw]=await Promise.all([
          gibddFetch(L.zalog),
          gibddFetch(L.fssp),
          gibddFetch("https://fedresurs.ru/backend/persons?limit=15&offset=0&searchString="+encodeURIComponent(L.fio))
        ]);
        const z=gibddParseZalog(zRaw.text, L.vin);
        const f=gibddParseFssp(fRaw.text);
        const b=gibddParseBankrot(bRaw.text, L.fio);
        const v=gibddVerdict(z,f,b);
        const pack={at:new Date().toISOString(), vin:L.vin, fio:L.fio, dob:L.dob, z, f, b, v, links:L};

          <p class="calc-note"><button type="button" class="btn ghost" data-gopen="${kind}">Открыть и подставить данные</button></p>`;
        if(box) box.innerHTML=`<div class="card dc-result ${v.ok===true?"ok":v.ok===false?"bad":""}">
          <p class="eyebrow">Сводка</p>
          <div class="calc-out" style="font-size:22px">${escape(v.text)}</div>

          <div class="who-line" style="margin-top:10px"><button type="button" class="btn ivory" id="gPdf">PDF</button></div>
        </div>`;
      }catch(err){
        const box=document.getElementById("gOut");
        if(box) box.innerHTML=`<div class="note-box">${escape(String(err&&err.message||err))}</div>`;
      }
    }

    function resumeExam(run){

      const fresh=(typeof kmShown==="undefined")||kmShown!==car.id;
      kmShown=car.id;

      const months=Math.max(1, kmVal("cMonths", 60));

      const pBundle=typeof PANGO_BUNDLE==="number"?PANGO_BUNDLE:150000;
      const pRateA=typeof PANGO_RATE_A==="number"?PANGO_RATE_A:17.4;

      const pNssRate=typeof PANGO_NSS==="number"?PANGO_NSS:0.0089;

      const pBase=Math.max(0, pFix-pDown)+pBundle;
      const pNss=Math.round(pBase*pNssRate*pYears);
      const pCreditB=pBase+pNss;
      const pPayA=calcPay(pBase+pDown, pDown, months, pRateA);
      const pPayB=calcPay(pCreditB+pDown, pDown, months, pRateB);
      const downPct=read.downPct;
      const pYearsLabel=Math.abs(pYears-Math.round(pYears))<0.05?String(Math.round(pYears)):pYears.toFixed(1);
      const yNum=Number(pYearsLabel);
      const pYearsWord=(yNum===1)?"год":(yNum>1&&yNum<5&&Math.abs(yNum-Math.round(yNum))<0.05?"года":"лет");
      return banner("Калькулятор","Тест · только PANGO","CHERY")+`
        <p class="lead">Эта машина продаётся только по PANGO. Цена фикс, скидки директа и флита не применяются.</p>
        <div class="km-stage">
        <div class="km-chips">${kmChipGroups(car.id)}</div>
        <div class="km-layout">
          <div class="card km-disc">
            <p class="eyebrow">Тест в продаже · ${escape(car.model)}</p>
            <p class="calc-note" style="margin-top:8px">VIN ${escape(car.vin)} · ${car.year} · пробег ${rub(car.km)} км</p>
            <div class="bank-row"><span>Цена розница</span><span class="pay">${rub(car.rrc)} ₽</span></div>
            <div class="bank-row"><span>Тюнинг уже в машине</span><span class="pay">${rub(car.tune)} ₽</span></div>
            <div class="note-box" style="margin-top:14px">
              <p class="eyebrow" style="margin:0 0 6px">Цена фикс · продажа на Авито</p>
              <div class="calc-out">${rub(pFix)} ₽</div>
              <p class="calc-note">Сумма не меняется. Тюнинг в неё не плюсуется.</p>
            </div>
            <label class="field" style="max-width:none;margin-top:12px"><span>Первый взнос, ₽</span><input id="cDown" inputmode="numeric" value="${pDown}" /></label>
            <label class="field" style="max-width:none"><span>Срок, мес.</span><input id="cMonths" inputmode="numeric" value="${months}" /></label>
            <input type="hidden" id="cDownMode" value="sum" />
            <p class="calc-note">${rub(pDown)} ₽ · ${downPct}% от цены фикс</p>
          </div>
          <div class="km-right">
            <div class="pay-col pango km-pay">
              <p class="eyebrow">Только PANGO</p>
              <div class="bank-row pay-top"><span><b>Платёж</b><br/><small>${pRateA}% · ${months} мес.</small></span><span class="pay">${rub(Math.round(pPayA))} ₽</span></div>
              <div class="bank-row"><span>Тело кредита</span><span class="pay">${rub(pBase)}</span></div>
              <p class="eyebrow" style="margin-top:8px">14,4% · НСС в теле</p>
              <div class="bank-row pay-top"><span><b>Платёж</b><br/><small>${pRateB}% · ${months} мес.</small></span><span class="pay">${rub(Math.round(pPayB))} ₽</span></div>
              <div class="bank-row"><span>Тело с НСС</span><span class="pay">${rub(pCreditB)}</span></div>
              <p class="calc-note">НСС 0,89% × ${pYearsLabel} ${pYearsWord}: ${rub(pNss)}. Каско + GAP + ДМС ${rub(pBundle)} в кредите. Директ и флит закрыты.</p>
            </div>
          </div>
        </div></div>`;
    }
    const kmChipGroupsBase=kmChipGroups;
    kmChipGroups=function(active){
      const html=kmChipGroupsBase(active);
      if(html.indexOf('data-km-id="tst8"')>=0) return html;
      const tests=(typeof TEST_SALE!=="undefined"?TEST_SALE:[]);
      if(!tests.length) return html;
      const slot=`<div class="km-slot s-test"><div class="km-line tone-test"><p class="stock-h">Тесты в продаже · только PANGO</p><div class="km-grid">${tests.map(x=>`<button type="button" class="chip ${x.id===active?"on":""}" data-km-id="${x.id}">${escape(x.short)}<small>фикс ${rub(x.fix)}</small></button>`).join("")}</div></div></div>`;
      if(html.indexOf('<div class="km-board">')<0) return slot+html;
      return html.replace('<div class="km-board">','<div class="km-board">'+slot);
    };
    refreshLocks().then(()=>{
      if(state.authed && state.surname && userRun() && !done){ resumeExam(userRun()); return; }
      if(view==="home"||view==="rate"||view==="hub") render();
    }).catch(()=>{});
    if(state.authed && state.surname && userRun() && !done && !paper.length) resumeExam(userRun());
  </script>
<script src="duty-overlay.js?v=d5"></script>
</body>
</html>
