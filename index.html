  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tinos:wght@400;700&display=swap");
:root {
  --bg:#f4f1ea;
  --fg:#111114;
  --muted:#5c5a54;
  --surface:#fffcf7;
  --border:#e4dfd4;
  --primary:#c81e2b;
  --primary-ink:#fff;
  --pass:#1f7a4d;
  --ok-bg:#e8f6ee;
  --bad-bg:#fdecee;
  --shadow:0 1px 0 rgba(17,17,20,.04), 0 12px 40px rgba(17,17,20,.06);
  --radius:14px;
}
* { box-sizing:border-box; }
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.011em;}
button,[role=button]{cursor:pointer;font-family:inherit;}
button:disabled{cursor:not-allowed;opacity:.4;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 56px;}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(10px);padding:10px 0 12px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;font-size:13px;text-transform:uppercase;}
.mark{width:28px;height:28px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;border-radius:7px;font-weight:800;}
nav.desk{display:flex;flex-wrap:wrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
nav.desk button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;}
nav.desk button.on{background:var(--fg);color:#fff;}
nav.bot{display:none!important;}
.eyebrow{letter-spacing:.22em;color:var(--primary);font-size:11px;text-transform:uppercase;margin:0 0 8px;font-weight:700;}
h1{font-size:clamp(36px,7vw,64px);line-height:.92;margin:0;letter-spacing:-.04em;font-weight:800;}
h1 span{display:block;color:var(--muted);font-weight:600;}
h2{letter-spacing:-.02em;margin:0;font-weight:700;}
.lead{color:var(--muted);line-height:1.55;max-width:440px;font-size:15px;}
.grid2{display:grid;gap:14px;margin-top:24px;}
.card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:left;}
.card h3{font-size:22px;margin:8px 0 6px;letter-spacing:-.03em;}
.card p{color:var(--muted);font-size:14px;line-height:1.5;margin:0;}
label.field{display:block;max-width:340px;margin-top:18px;}
label.field span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;}
input,textarea{width:100%;background:#fff;border:1px solid var(--border);color:var(--fg);border-radius:10px;padding:12px;font:15px Inter,sans-serif;}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:28px;}.actions>*{width:100%;}
.models{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
@media(min-width:720px){.grid2{grid-template-columns:1.1fr .9fr;}.actions{display:flex;flex-direction:column;}}
.rank{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.rank b{font-size:16px;}
.rank.guest,.rank.head{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px;align-items:center;gap:8px;}
.rank.head{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:8px;}
.rank.head span:nth-child(2),.rank.head span:nth-child(3),.rank.guest .pct{text-align:right;}
.rank .place-n{width:28px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;}
.pct{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;letter-spacing:-.04em;white-space:nowrap;}
.empty{color:var(--muted);padding:8px 0;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:8px 0 6px;min-height:210px;}
.pod{flex:1;max-width:200px;text-align:center;min-width:0;}
.pod .who{font-weight:800;font-size:14px;letter-spacing:-.02em;margin:0 0 8px;line-height:1.2;word-break:break-word;}
.pod .who span{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}
.pod .step{border-radius:12px 12px 4px 4px;padding:14px 8px 12px;color:#fff;}
.pod.p1 .step{min-height:128px;background:linear-gradient(180deg,#f0d36a,#c9a227);}
.pod.p2 .step{min-height:96px;background:linear-gradient(180deg,#d7dce2,#8b929a);}
.pod.p3 .step{min-height:76px;background:linear-gradient(180deg,#e0b07a,#b87333);}
.pod .place{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.9;}
.pod .score{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-top:6px;}
.pod.ghost .who{color:var(--muted);font-weight:600;}
.pod.ghost .step{background:#efeae0;color:var(--muted);min-height:64px;}
.banner{min-height:150px;border:1px solid var(--border);border-radius:20px;margin-top:8px;background:radial-gradient(1200px 200px at 100% 0,#f7d7d9 0,transparent 50%),linear-gradient(180deg,#fff,#f3efe6);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px;box-shadow:var(--shadow);}
.banner b{font-size:28px;letter-spacing:-.03em;}
.banner-name{font-size:clamp(40px,8vw,64px);line-height:.85;letter-spacing:-.06em;font-weight:800;color:#161618;}
.card.ok{border-color:#9ad4b4;background:var(--ok-bg);}
.card.bad{border-color:#f0b4b8;background:var(--bad-bg);}
.tabs{display:flex;flex-wrap:wrap;gap:0;border:0;background:transparent;border-bottom:1px solid var(--border);border-radius:0;padding:0;width:100%;margin:18px 0 8px;}
.tabs button{border:0;background:transparent;color:var(--muted);border-radius:0;padding:10px 16px 12px;font-weight:600;font-size:14px;position:relative;}
.tabs button.on{background:transparent;color:var(--fg);}
.tabs button.on:after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;background:var(--primary);}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;}
.btn.ivory{background:var(--primary);color:#fff;}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border);}
.bar{height:3px;background:#e8e5de;border-radius:99px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--primary);width:0;}
.opt{width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:12px;padding:13px;display:flex;gap:10px;margin:8px 0;font-weight:500;}
.opt.on{border-color:var(--primary);background:#fff5f5;}
.opt.good{border-color:var(--pass);background:var(--ok-bg);}
.opt.bad{border-color:var(--primary);background:var(--bad-bg);}
.explain{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;font-size:14px;line-height:1.5;background:var(--surface);}
.clock{font-variant-numeric:tabular-nums;font-size:28px;font-weight:800;letter-spacing:-.04em;}
.clock.warn{color:var(--primary);}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;}
.chip.on{background:var(--fg);color:#fff;border-color:var(--fg);}
.study-pick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;}
.study-pick .chip{flex:0 0 auto;white-space:nowrap;}
.rate-board{display:flex;gap:10px;overflow-x:auto;margin-top:16px;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
.rate-col{flex:1 0 196px;min-width:196px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:12px 12px 10px;box-shadow:var(--shadow);}
.rate-col .eyebrow{margin-bottom:2px;}
.rate-col h3{font-size:17px;margin:0 0 10px;letter-spacing:-.03em;}
.rate-head,.rate-person{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;gap:4px;align-items:center;}.rate-person .pct.span2{grid-column:2/4;text-align:center;}
.rate-head{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 0 6px;border-bottom:1px solid var(--border);}
.rate-head span:nth-child(2),.rate-head span:nth-child(3),.rate-person .pct{text-align:right;}
.rate-person{padding:8px 0;border-bottom:1px solid var(--border);}
.rate-person b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rate-person p{margin:0;font-size:11px;color:var(--muted);line-height:1.3;}
.rate-person .pct{font-size:14px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;}
.rate-person .pct.ok{color:var(--pass);}
.rate-person .pct.low{color:var(--primary);}
.rate-split{margin:10px 0 4px;border:0;border-top:1px solid var(--fg);padding-top:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.rate-col .empty{font-size:12px;padding:6px 0 4px;}

.model-card .car{display:none;}
.models{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
.model-row{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  margin-top:18px;
}
.models .card,
.model-card{
  position:relative;
  display:flex;
  flex-direction:column;
  padding:0;
  overflow:hidden;
  min-height:0;
  text-align:left;
  background:#fffcf7;
}
.models .card::before,
.model-row .card::before{
  content:"";
  display:block;
  width:100%;
  aspect-ratio:16/10;
  background-color:#efeae0;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
  border-bottom:1px solid var(--border);
}
.model-row .card::before{aspect-ratio:4/5;}
.models .card::after{content:none!important;display:none!important;}
.models .card[data-model="t4l"]::before,
.model-row .card[data-model="t4l"]::before{background-image:url("cars/t4l.jpg"),url("https://img.perxis.ru/unsafe/960x600/filters:format(jpeg):quality(78)/chry/originals/d7p04gqto5r7ch3usvi0/original");}
.models .card[data-model="t7"]::before,
.model-row .card[data-model="t7"]::before{background-image:url("cars/t7.jpg?v=3");background-position:40% 50%;}
.models .card[data-model="t8"]::before,
.model-row .card[data-model="t8"]::before{background-image:url("cars/t8.jpg?v=3");background-position:52% 55%;}
.models .card[data-model="t9"]::before,
.model-row .card[data-model="t9"]::before{background-image:url("cars/t9.jpg"),url("https://img.perxis.ru/unsafe/960x600/filters:format(jpeg):quality(78)/chry/originals/d9avnv2to5r6hlpdspfg/original");}
.models .card[data-model="a8"]::before,
.model-row .card[data-model="a8"]::before{background-image:url("cars/a8.jpg"),url("https://img.perxis.ru/unsafe/960x600/filters:format(jpeg):quality(78)/chry/originals/d9avncqto5r6hlpdspeg/original");}
.models .card .txt,
.model-row .card .txt{
  position:relative;
  z-index:1;
  max-width:none;
  padding:12px 12px 14px;
}
.models .card .eyebrow,
.model-row .card .eyebrow{margin:0 0 4px;}
.models .card h3{margin:0 0 6px;font-size:20px;}
.model-row .card h3{margin:0 0 4px;font-size:16px;letter-spacing:-.03em;}
.models .card p,
.model-row .card p{max-width:none;}
.model-row .card p{
  font-size:12px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.models .card:hover,
.model-row .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(17,17,20,.08);}
.model-row .card.is-on{border-color:#161618;}
@media (max-width:820px){
  .model-row{
    display:flex;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:6px;
  }
  .model-row .card{flex:0 0 168px;}
}
.hidden{display:none!important;}
.study-body p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 10px;}
.study-body ul{margin:0 0 12px;padding:0 0 0 18px;color:var(--muted);font-size:14px;line-height:1.55;}
.study-body li{margin:5px 0;}
.study-body b,.study-body strong{color:var(--fg);font-weight:700;}
.study-body h3{font-size:15px;margin:14px 0 8px;letter-spacing:-.02em;}
.study-body h3:first-child{margin-top:0;}
.docs{display:grid;gap:10px;}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.doc h3{margin:4px 0 6px;font-size:18px;}
.doc .meta{color:var(--muted);font-size:13px;margin:0;line-height:1.4;}
.doc .acts{display:flex;gap:8px;flex-wrap:wrap;}
.doc-strip{display:grid;gap:8px;margin-top:16px;}
.doc-mini{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13px;}
.doc-mini b{font-size:13px;}
.doc-mini span{color:var(--muted);}
.doc-mini a{font-weight:700;border-bottom:1px solid var(--border);}
.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;}
@media(min-width:900px){.hub-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}}
.hub-card{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  padding:0;
  overflow:hidden;
  min-height:0;
  text-align:left;
  background:#fffcf7;
}
.hub-card::before{
  content:"";
  display:block;
  width:100%;
  aspect-ratio:16/10;
  background-color:#efeae0;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
  border-bottom:1px solid var(--border);
}
.hub-card[data-go="home"]::before{background-image:url("hub/attest.jpg?v=2");background-position:50% 55%;}
.hub-card[data-go="terms"]::before{background-image:url("hub/terms.jpg?v=1");background-position:55% 42%;}
.hub-card[data-go="calc"]::before{background-image:url("hub/calc.jpg?v=1");background-position:38% 48%;}
.hub-card[data-go="stock"]::before{background-image:url("hub/stock.jpg?v=3");background-position:50% 58%;}
.hub-card[data-go="docs"]::before{background-image:url("hub/docs.jpg?v=1");background-position:50% 50%;}
.hub-card[data-go="epts"]::before{background-image:url("hub/epts.jpg?v=5");background-position:50% 48%;background-size:cover;}
.hub-card[data-go="gibdd"]::before{background-image:url("hub/gibdd.jpg?v=5");background-position:50% 50%;background-size:cover;}
.hub-card[data-go="duty"]::before{background-image:url("hub/duty.jpg?v=5");background-position:50% 48%;background-size:cover;}
.epts-steps{display:grid;gap:10px;margin-top:22px;}
.epts-step{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:16px 16px 18px;box-shadow:var(--shadow);text-align:left;}
.epts-step.is-wait{opacity:.55;}
.epts-step.is-done{border-color:#9ad4b4;background:var(--ok-bg);}
.epts-step.is-on{border-color:#161618;}
.epts-n{width:28px;height:28px;border-radius:8px;background:var(--fg);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto;}
.epts-step.is-wait .epts-n{background:#d9d4c8;color:var(--muted);}
.epts-step.is-done .epts-n{background:var(--pass);}
.epts-head{display:flex;gap:12px;align-items:center;}
.epts-head h3{margin:0;font-size:18px;letter-spacing:-.03em;}
.epts-head p{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.4;}
.epts-body{margin-top:14px;}
.epts-vin{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;font-size:16px;}
.epts-found{margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff;}
.epts-found b{display:block;font-size:16px;margin:0 0 4px;}
.epts-found span{color:var(--muted);font-size:13px;}
.epts-sheet-wrap{margin-top:12px;border:1px solid var(--border);border-radius:12px;overflow:visible;background:#cfc8ba;padding:14px;}
.epts-sheet-wrap iframe,.epts-sheet-wrap img{width:100%;max-width:760px;height:auto;margin:0 auto;border:0;background:#fff;display:block;box-shadow:0 10px 30px rgba(17,17,20,.14);}
.epts-meta{display:grid;gap:8px;margin:12px 0;}
@media(min-width:720px){.epts-meta{grid-template-columns:1fr 1fr 1fr;}}
.epts-meta .card{margin:0;padding:12px 14px;}
.epts-meta h4{margin:0 0 4px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.epts-meta b{font-size:20px;letter-spacing:-.03em;}
.epts-mail{display:grid;gap:8px;margin-top:8px;}
.epts-mail code{font-size:13px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:block;word-break:break-all;}
.epts-warn{border:1px solid #f0b4b8;background:var(--bad-bg);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;margin-top:12px;color:var(--fg);}
.epts-ok{border:1px solid #9ad4b4;background:var(--ok-bg);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;margin-top:12px;}

.hub-mark{
  position:absolute;
  top:12px;left:12px;z-index:1;
  width:36px;height:36px;border-radius:10px;
  background:var(--primary);color:#fff;
  display:grid;place-items:center;
  font-weight:800;font-size:13px;
  box-shadow:0 8px 20px rgba(17,17,20,.18);
}
.hub-card .txt{padding:14px 14px 16px;}
.hub-card h3{margin:0 0 6px;font-size:22px;letter-spacing:-.03em;}
.hub-card p{margin:0;max-width:none;}
.hub-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(17,17,20,.08);}
.who-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0;}
.sheet{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 18px;}
.sheet th,.sheet td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.sheet th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.sheet .num{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;white-space:nowrap;}
.st{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.04em;}
.st.in{background:var(--ok-bg);color:var(--pass);}
.st.hold{background:#f7ead0;color:#8a5a12;}
.st.way{background:#ece9e2;color:var(--muted);}
.st.inv{background:#f3d5d4;color:var(--primary);}
.vin{font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.02em;white-space:nowrap;}
.calc-grid{display:grid;gap:14px;margin-top:18px;}
@media(min-width:720px){.calc-grid{grid-template-columns:1.05fr .95fr;}}
.calc-out{font-size:clamp(32px,6vw,48px);font-weight:800;letter-spacing:-.04em;margin:4px 0 8px;}
.calc-note{color:var(--muted);font-size:13px;line-height:1.45;margin:0;}
.note-box{border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.45;margin:12px 0 8px;}
.brand{cursor:pointer;}


.terms-col{max-width:1080px}
.terms-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:8px 0 22px}
.term-card{border:1px solid var(--border);background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.term-card b{display:block;font-size:15px;letter-spacing:-.02em}

    function betterExam(a,b){
      if(!a) return b;
      if(!b) return a;
      const ad=a.status!=="running", bd=b.status!=="running";
      if(ad && !bd) return Object.assign({}, a, {status:"done"});
      if(bd && !ad) return Object.assign({}, b, {status:"done"});
      const ap=Number(a.percent||0), bp=Number(b.percent||0);
      let win, lose;
      if(bp>ap){ win=b; lose=a; }
      else if(ap>bp){ win=a; lose=b; }
      else { win = String(b.at||"")>=String(a.at||"") ? b : a; lose = win===b?a:b; }
      const out=Object.assign({}, lose, win);
      if(ad || bd) out.status="done";
      if(a.tgSent || b.tgSent) out.tgSent=true;
      if(out.status==="done") delete out.run;
      return out;

      const n=Math.max(1, Number(months)||60);
      let idx=0;
      const exact=terms.indexOf(n);
      if(exact>=0) idx=exact;
      else if(n>=terms[terms.length-1]) idx=terms.length-1;
      else if(n<=terms[0]) idx=0;
      else {
        let best=Math.abs(terms[0]-n);
        for(let i=1;i<terms.length;i++){
          const d=Math.abs(terms[i]-n);
          if(d<best){ best=d; idx=i; }
        }
      }
      const band=kmDownBand(downPct);
      const table=(KM_BANK_RATES[bankId]||{})[group]||(KM_BANK_RATES[bankId]||{}).t4l_t7||{};
      const row=table[band]||table[10]||table[20]||[];
      let rate=row[idx];
      if(!(rate>=0)){
        for(let i=idx;i>=0;i--){ if(row[i]>=0){ rate=row[i]; break; } }
      }
      return {rate: Number(rate)||0, term: terms[idx], band, capped: terms[idx]!==n};

        const payMpt=calcPay(price+extras, downMpt, term, look.rate);
        return Object.assign({}, b, {rate:look.rate, term, capped:!!look.capped, pay, payMpt, over:pay*term-credit, overMpt:payMpt*term-creditMpt});
      });

          const over=Math.round(b[overKey]||0);

        }).join("");
      }

              ${Math.round(rrc+addons)>Math.round(client)?`<div class="calc-out" style="text-decoration:line-through;opacity:.42;margin-bottom:2px">${rub(Math.round(rrc+addons))} ₽</div>`:""}
              <div class="calc-out">${rub(Math.round(client))} ₽</div>
              <p class="calc-note">Авто ${rub(Math.round(carPrice))} + Д/О ${rub(Math.round(addons))}. Каско не входит.${discount?` Скидка ${rub(Math.round(discount))}.`:""}</p>

            ${useLoan

              :`<label class="field" style="max-width:none"><span>КАСКО, ₽</span><input id="kmCasco" inputmode="numeric" value="${casco}" /></label>`}
            ${prio?`<div class="note-box">Приоритетный VIN ${escape(kmVin)}. Коридор ${lo} … ${hi} тыс.</div>`:""}

              ${downMode==="sum"

              <p class="calc-note">${rub(down)} ₽ · ${downPct}% от цены авто${showMpt?` · для МПТ банк видит ПВ ${rub(downMpt)} ₽ (−200 тыс.)`:""}</p>
              <label class="field" style="max-width:none"><span>Срок, мес.</span><input id="cMonths" inputmode="numeric" value="${months}" /></label>
              ${showSplit?`<div class="pay-split">

                  <p class="eyebrow">Обычный кредит</p>
                  <p class="calc-note">ПВ ${rub(down)} · тело ${rub(credit)}</p>

              ${kmPayRows(banks,"payMpt","overMpt")}`

            </div>`:`<div class="card"><p class="eyebrow">Кредит</p><p class="lead" style="max-width:none">Включите галочку «Кредит», чтобы открыть расчёт платежа${hasMpt?" и сравнение с МПТ":""}.</p></div>`}

    function calc(){
      if(needAuth()) return login();
      calcMode="km";
      return calcKm();
    }
    function salonLabel(s){
      const t=String(s||"");
      if(/korichnev/i.test(t)) return "Brown";
      if(/коричнев/i.test(t)) return "Brown";
      return t;
    }
    function stockRrc(r){
      if(r && r.rrc) return Number(r.rrc)||0;
      let id="";
      if(typeof kmIdFromCar==="function") id=kmIdFromCar(r)||"";
      if(!id){
        const t=String(r&&r.trim||"").toLowerCase();
        const m=r&&r.model||"";
        if(m==="t4") id="t4p";
        else if(m==="t4l") id=t.includes("прайм")?"t4lp":"t4la";
        else if(m==="t7"){
          if(t.includes("4wd")&&t.includes("прайм")) id="t7p4";
          else if(t.includes("4wd")) id="t7a4";
          else if(t.includes("прайм")) id="t7p";
          else id="t7a";
        }else if(m==="t8"){
          if(t.includes("ультра")) id="t8u4";
          else if(t.includes("4wd")) id="t8p4";
          else if(t.includes("прайм")) id="t8p";
          else id="t8a";
        }else if(m==="t9") id=t.includes("прайм")?"t9p":"t9u";
        else if(m==="a8"){
          if(t.includes("ультра")) id="a8u";
          else if(t.includes("актив")) id="a8a";
          else id="a8p";
        }else if(m==="t7l") id="t7l";
      }
      if(typeof KM_MODELS!=="undefined"){
        const line=(KM_MODELS.find(x=>x.id===id)||{});
        if(line.rrc) return line.rrc;
      }
      const map={t4p:2449000,t4la:2329000,t4lp:2479000,t7a:2785000,t7p:2985000,t7a4:2990000,t7p4:3190000,t8a:3099000,t8p:3299000,t8p4:3630000,t8u4:3885000,t9p:4335000,t9u:4640000,a8a:2865000,a8p:3060000,a8u:3275000,t7l:2735000};
      return map[id]||0;
    }
    function stockBadges(r){
      const bits=[];
      bits.push(`<span class="st ${r.status}">${(ST_LABEL&&ST_LABEL[r.status])||r.status}</span>`);
      if(r.invoice) bits.push(`<span class="st inv">Спец инвойс</span>`);
      if(r.mpt) bits.push(`<span class="st mpt">МПТ</span>`);
      if(r.corp || (typeof CORP_VINS!=="undefined" && CORP_VINS.has(r.vin))) bits.push(`<span class="st corp">Корпоративный</span>`);
      if(r.demo) bits.push(`<span class="st demo">ДЕМО</span>`);
      return bits.join(" ");
    }
    function stockCard(r){

      return `<article class="st-row">

    function stock(){
      if(needAuth()) return login();
      const meta=typeof STOCK_META==="object"?STOCK_META:{updated:"11.09.2026"};
      const list=STOCK.filter(x=>{
        if(stockFilter!=="all" && x.model!==stockFilter) return false;
        if(stockStatus!=="all" && x.status!==stockStatus) return false;
        return true;
      });
      const scoped=stockFilter==="all"?STOCK:STOCK.filter(x=>x.model===stockFilter);
      const nIn=scoped.filter(x=>x.status==="in").length;
      const nWay=scoped.filter(x=>x.status==="way").length;
      const byModel={};
      list.forEach(r=>{ (byModel[r.model]=byModel[r.model]||[]).push(r); });
      const modelOrder=["t4","t4l","t7","t8","t9","t7l","a8"];
      const ids=modelOrder.filter(id=>byModel[id]);
      const body = list.length
        ? ids.map(id=>{
            const m=MODELS[id]||{id,brand:"TENET",name:id.toUpperCase()};
            const rows=byModel[id];
            const inn=rows.filter(x=>x.status==="in").length;
            const way=rows.filter(x=>x.status==="way").length;
            const bits=[];

            return `<details class="st-acc" ${opened?"open":""}>

          <button class="chip ${stockStatus==="way"?"on":""}" data-stock-st="way">В пути · ${nWay}</button>
        </div>
        ${body}`;
    }

    function eptsCleanVin(v){
      return String(v||"").toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,"").slice(0,17);
    }
    function eptsMoscowNow(){
      const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
      const g=t=>Number(parts.find(p=>p.type===t).value);
      return {y:g("year"),m:g("month"),d:g("day")};
    }
    function eptsUtcDate(y,m,d){ return new Date(Date.UTC(y,m-1,d)); }
    function eptsDow(dt){ return dt.getUTCDay(); }
    function eptsIsWeekend(dt){ const d=eptsDow(dt); return d===0||d===6; }
    function eptsFmt(dt){
      const dd=String(dt.getUTCDate()).padStart(2,"0");
      const mm=String(dt.getUTCMonth()+1).padStart(2,"0");
      return dd+"."+mm+"."+dt.getUTCFullYear();
    }
    function eptsAddDays(dt,n){ const x=new Date(dt.getTime()); x.setUTCDate(x.getUTCDate()+n); return x; }
    function eptsPayBy(issued){
      let d=new Date(issued.getTime());
      if(eptsIsWeekend(d)){
        while(eptsIsWeekend(d)) d=eptsAddDays(d,1);
      }
      let count=1;
      while(count<3){
        d=eptsAddDays(d,1);
        if(!eptsIsWeekend(d)) count++;
      }
      return d;
    }
    function eptsMailPack(draft){
      const weekend=eptsIsWeekend(draft.issuedDt);
      const vin=draft.vin;
      const pay=draft.payBy;
      const line="Прошу согласовать передачу ЭПТС для заключения договора с клиентом. Оплата до "+pay+", отзывных нет, гарантийное письмо во вложении.";
      const who=weekend?"Коллеги, добрый день! ":"Антон, добрый день! ";
      return {

        to: weekend?EPTS_TO_WEEKEND:EPTS_TO_WORK,
        cc: (weekend?[EPTS_TO_WORK]:[]).concat(EPTS_CC).join(", "),
        subj: "ЭКСПЕРТ АВТО САМАРА_ЭПТС VIN "+vin,

    function eptsLetterName(id, fallback){
      if(id==="t4l") return "TENET Т4L";
      if(id==="t7") return "TENET Т7";
      if(id==="t8") return "TENET Т8";
      if(id==="t9") return "CHERY Tiggo 9";
      if(id==="a8") return "CHERY Arrizo 8";
      const m=MODELS[id];
      if(m) return m.brand+" "+m.name;
      return fallback||"TENET";
    }
    function eptsLookup(vinRaw){
      const vin=eptsCleanVin(vinRaw);
      if(!vin) return {vin:"", ok:false};
      const stock=(typeof STOCK!=="undefined"?STOCK:[]).find(x=>String(x.vin||"").toUpperCase()===vin);
      if(stock){
        const m=MODELS[stock.model]||{};
        return {
          vin, ok:true, fromStock:true, model:stock.model,
          letter:eptsLetterName(stock.model, (m.brand||"TENET")+" "+(stock.name||"")),
          title:(m.brand||"TENET")+" "+(stock.name||""),
          trim:stock.trim||"", color:stock.color||"", note:stock.note||"", status:stock.status||""
        };
      }
      const pref=EPTS_PREFIX.find(([p])=>vin.startsWith(p));
      if(pref){
        const id=pref[1];
        const m=MODELS[id]||{};
        return {
          vin, ok:true, fromStock:false, model:id,
          letter:eptsLetterName(id),
          title:(m.brand||"")+" "+(m.name||id.toUpperCase()),
          trim:"", color:"", note:"Модель по префиксу VIN, в складе салона нет.", status:""
        };
      }
      if(eptsModel && MODELS[eptsModel]){
        const m=MODELS[eptsModel];
        return {
          vin, ok:vin.length>=11, fromStock:false, model:eptsModel,
          letter:eptsLetterName(eptsModel),
          title:m.brand+" "+m.name,
          trim:"", color:"", note:"Модель указана вручную.", status:""
        };
      }
      return {vin, ok:false, note:"VIN не найден. Выберите модель вручную."};
    }
    function eptsLookupHtml(vinRaw){
      const hit=eptsLookup(vinRaw);
      if(!hit.vin) return `<p class="lead" style="margin-top:12px">17 символов, латиница и цифры. Склад подставит модель сам.</p>`;
      if(!hit.ok && !hit.model){
        return `<div class="epts-found"><b>VIN не распознан</b><span>${escape(hit.note||"Выберите модель чипом ниже.")}</span></div>`;
      }
      const st=hit.status==="in"?"В наличии":hit.status==="way"?"В пути":hit.fromStock?"На складе":"Не на складе";
      return `<div class="epts-found">
        <b>${escape(hit.letter)} · ${escape(hit.vin)}</b>
        <span>${escape([hit.trim, hit.color, st, hit.note].filter(Boolean).join(" · "))}</span>
      </div>`;
    }
    function eptsLoadImg(src){
      return new Promise((resolve,reject)=>{
        const im=new Image();
        im.onload=()=>resolve(im);
        im.onerror=()=>reject(new Error(src));
        im.src=src;
      });
    }
    let eptsStamp=null, eptsSign=null;

      try{ await document.fonts.ready; }catch(e){}
      try{ await document.fonts.load("28px Tinos"); }catch(e){}
      if(eptsStamp && eptsSign) return;
      const [a,b]=await Promise.all([

        eptsLoadImg("epts/sign.png").catch(()=>eptsLoadImg("epts/sign.jpg")).catch(()=>eptsLoadImg(EPTS_SIGN_DATA))
      ]);
      eptsStamp=a; eptsSign=b;
    }
    function eptsWrap(ctx, text, maxW){
      const words=String(text||"").split(/\s+/);
      const lines=[];
      let line="";
      for(const w of words){
        const t=line?line+" "+w:w;
        if(ctx.measureText(t).width<=maxW) line=t;
        else { if(line) lines.push(line); line=w; }
      }
      if(line) lines.push(line);
      return lines;
    }
    const eptsInkCache=typeof WeakMap==="function"?new WeakMap():null;
    function eptsInkBox(img){
      if(!img) return null;
      if(eptsInkCache && eptsInkCache.has(img)) return eptsInkCache.get(img);
      const c=document.createElement("canvas");
      c.width=img.width; c.height=img.height;
      const g=c.getContext("2d");
      g.drawImage(img,0,0);
      const data=g.getImageData(0,0,c.width,c.height).data;
      let minX=c.width,minY=c.height,maxX=0,maxY=0,found=0;
      for(let yy=0;yy<c.height;yy++){
        for(let xx=0;xx<c.width;xx++){
          const i=(yy*c.width+xx)*4;
          if(data[i+3]<18) continue;
          if(data[i]>246 && data[i+1]>246 && data[i+2]>246) continue;
          found++;
          if(xx<minX) minX=xx; if(xx>maxX) maxX=xx;
          if(yy<minY) minY=yy; if(yy>maxY) maxY=yy;
        }
      }
      const box=found?{x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1}:{x:0,y:0,w:img.width,h:img.height};
      if(eptsInkCache) eptsInkCache.set(img, box);
      return box;
    }

    function eptsJpegToPdf(jpeg, w, h){
      const pageW=595, pageH=842;
      const encoder=new TextEncoder();
      const chunks=[];
      const pushStr=s=>chunks.push(encoder.encode(s));
      const pushBytes=u=>chunks.push(u);
      const objects=[];
      const addObj=(bodyBytes)=>{
        objects.push(bodyBytes);
        return objects.length;
      };
      const cat=addObj(encoder.encode("<< /Type /Catalog /Pages 2 0 R >>"));
      const pages=addObj(encoder.encode("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
      const page=addObj(encoder.encode("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pageW+" "+pageH+"] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>"));
      const content="q "+pageW+" 0 0 "+pageH+" 0 0 cm /Im0 Do Q\n";
      const contentBytes=encoder.encode(content);
      const stream1=new Uint8Array(encoder.encode("<< /Length "+contentBytes.length+" >>\nstream\n").length+contentBytes.length+encoder.encode("\nendstream").length);
      const h1=encoder.encode("<< /Length "+contentBytes.length+" >>\nstream\n");
      const t1=encoder.encode("\nendstream");
      stream1.set(h1,0); stream1.set(contentBytes,h1.length); stream1.set(t1,h1.length+contentBytes.length);
      const cont=addObj(stream1);
      const imgHead=encoder.encode("<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpeg.length+" >>\nstream\n");
      const imgTail=encoder.encode("\nendstream");
      const imgBody=new Uint8Array(imgHead.length+jpeg.length+imgTail.length);
      imgBody.set(imgHead,0); imgBody.set(jpeg,imgHead.length); imgBody.set(imgTail,imgHead.length+jpeg.length);
      const img=addObj(imgBody);
      void cat; void pages; void page; void cont; void img;
      const header=encoder.encode("%PDF-1.4\n");
      const parts=[header];
      let offset=header.length;
      const xref=[0];
      objects.forEach((body,i)=>{
        xref.push(offset);
        const o=encoder.encode((i+1)+" 0 obj\n");
        const e=encoder.encode("\nendobj\n");
        parts.push(o, body, e);
        offset+=o.length+body.length+e.length;
      });
      const xrefStart=offset;
      let xrefStr="xref\n0 "+(objects.length+1)+"\n0000000000 65535 f \n";
      xref.slice(1).forEach(off=>{
        xrefStr+=String(off).padStart(10,"0")+" 00000 n \n";
      });
      xrefStr+="trailer << /Size "+(objects.length+1)+" /Root 1 0 R >>\nstartxref\n"+xrefStart+"\n%%EOF";
      parts.push(encoder.encode(xrefStr));
      let total=0; parts.forEach(p=>total+=p.length);
      const out=new Uint8Array(total);
      let p=0; parts.forEach(b=>{ out.set(b,p); p+=b.length; });
      return out;
    }
    async function eptsBuildPdf(draft){
      await eptsEnsureImgs();
      const canvas=document.createElement("canvas");
      eptsDrawLetter(canvas, draft);
      const dataUrl=canvas.toDataURL("image/jpeg",0.86);
      const bin=atob(dataUrl.split(",")[1]);
      const jpeg=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) jpeg[i]=bin.charCodeAt(i);
      const pdf=eptsJpegToPdf(jpeg, canvas.width, canvas.height);
      const blob=new Blob([pdf],{type:"application/pdf"});
      const url=URL.createObjectURL(blob);
      return {blob,url,bytes:pdf,preview:dataUrl,name:"EPTS-"+draft.vin+"-"+draft.issued.replace(/\./g,"")+".pdf"};
    }
    function eptsB64(bytes){
      let s="", chunk=0x8000;
      for(let i=0;i<bytes.length;i+=chunk){
        s+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
      }
      return btoa(s);
    }
    function eptsFoldB64(s){
      return s.replace(/(.{76})/g,"$1\r\n");
    }
    function eptsBuildEml(draft, pdf){
      const mail=eptsMailPack(draft);
      const to=draft.to||mail.to;
      const cc=draft.cc||mail.cc;
      const subj=draft.subj||mail.subj;
      const body=(draft.body||mail.body).replace(/\n/g,"\r\n");
      const filename=pdf.name;
      const bound="=_epts_"+Date.now().toString(36);
      const b64=eptsFoldB64(eptsB64(pdf.bytes));
      const eml=[
        "X-Unsent: 1",
        "MIME-Version: 1.0",
        "To: "+to,
        "Cc: "+cc,
        "Subject: =?UTF-8?B?"+btoa(unescape(encodeURIComponent(subj)))+"?=",
        "Content-Type: multipart/mixed; boundary=\""+bound+"\"",
        "",
        "--"+bound,
        "Content-Type: text/plain; charset=UTF-8",
        "Content-Transfer-Encoding: 8bit",
        "",
        body,
        "--"+bound,
        "Content-Type: application/pdf; name=\""+filename+"\"",
        "Content-Transfer-Encoding: base64",
        "Content-Disposition: attachment; filename=\""+filename+"\"",
        "",
        b64,
        "--"+bound+"--"
      ].join("\r\n");
      return new Blob([eml],{type:"message/rfc822"});
    }
    function eptsDownload(blob, name){
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=name;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    }

      const inner=W-pad*2;
      function roundRect(x,y,w,h,r){
        ctx.beginPath();
        ctx.moveTo(x+r,y);
        ctx.arcTo(x+w,y,x+w,y+h,r);
        ctx.arcTo(x+w,y+h,x,y+h,r);
        ctx.arcTo(x,y+h,x,y,r);

          tick(cx, cy, row[1]);

      function block(title, keys){
        const rows=Math.ceil(keys.length/3);

        ctx.fillStyle="#f7f1e7";
        roundRect(pad, y, inner, h, 14); ctx.fill();

        keys.forEach((pair,i)=>{

        ["dm_dust","Пыль"],["dm_wheel","Колёса"],["dm_bat","АКБ"]

      ctx.fillStyle="#5c5346"; ctx.font="500 16px Inter, Arial, sans-serif";
      ctx.fillText("Заметка: "+(d.note||"—"), pad, y+8);
      ctx.fillText("Подпись: "+(d.sign||d.manager||""), pad, y+36);
      ctx.fillStyle="#9a9186"; ctx.font="500 13px Inter, Arial, sans-serif";

    function gibddSplitFio(s){
      const p=String(s||"").trim().split(/\s+/).filter(Boolean);
      return {last:p[0]||"", first:p[1]||"", mid:p.slice(2).join(" ")};
    }
    function gibddDob(s){
      const t=String(s||"").trim();
      const m=t.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/) || t.match(/^(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})$/);
      if(!m) return t;
      if(m[1].length===4) return ("0"+m[3]).slice(-2)+"."+("0"+m[2]).slice(-2)+"."+m[1];
      const y=m[3].length===2?("20"+m[3]):m[3];
      return ("0"+m[1]).slice(-2)+"."+("0"+m[2]).slice(-2)+"."+y;
    }
    function gibddMaskDob(el){

    }

    function gibddLinks(form){
      const vin=String((form&&form.vin)||"").replace(/\s+/g,"").toUpperCase();
      const fio=String((form&&form.fio)||"").trim();
      const dob=gibddDob((form&&form.dob)||"");
      const nm=gibddSplitFio(fio);
      const fssp="https://fssp.gov.ru/iss/ip?is%5Blast_name%5D="+encodeURIComponent(nm.last)+
        "&is%5Bfirst_name%5D="+encodeURIComponent(nm.first)+

        "&is%5Bdate%5D="+encodeURIComponent(dob)+

      const zalog="https://www.reestr-zalogov.ru/search/index?vin="+encodeURIComponent(vin);
      const bankrot="https://fedresurs.ru/bankrupts?searchString="+encodeURIComponent(fio);
      const bankrotOld="https://bankrot.fedresurs.ru/Debtors.search.aspx?Name="+encodeURIComponent(fio);

    async function gibddFetch(url){
      const ctrl=typeof AbortController==="function"?new AbortController():null;
      const t=setTimeout(()=>{ try{ if(ctrl) ctrl.abort(); }catch(e){} }, 8000);
      try{
        const r=await fetch(url,{signal:ctrl?ctrl.signal:undefined, cache:"no-store"});
        const text=await r.text();
        return {ok:r.ok, status:r.status, text:text.slice(0,12000)};
      }catch(e){
        return {ok:false, status:0, text:String(e&&e.message||e)};
      }finally{ clearTimeout(t); }
    }
    function gibddParseZalog(text, vin){
      const t=String(text||"");
      if(/ничего не найдено|не найдено уведомлен/i.test(t)) return {hit:false, n:0, detail:"Записей по VIN нет"};
      const recs=t.match(/20\d{2}-\d{3}-\d+/g)||[];
      if(recs.length) return {hit:true, n:recs.length, detail:"Найдены уведомления: "+recs.slice(0,6).join(", ")};
      return {hit:null, n:0, detail:"Нужна капча на сайте. VIN скопирован."};
    }
    function gibddParseFssp(text){
      const t=String(text||"");
      if(/Ничего не найдено|не найдено исполнительн/i.test(t)) return {hit:false, n:0, detail:"ИП не найдено"};
      const ips=t.match(/\d+\/\d+\/\d+-?И?П?/g)||[];
      if(ips.length) return {hit:true, n:ips.length, detail:"Найдены ИП: "+ips.slice(0,8).join(", ")};
      return {hit:null, n:0, detail:"ФССП просит капчу. Регион — Все. ФИО и дата в ссылке."};
    }
    function gibddParseBankrot(text, fio){
      const t=String(text||"");
      if(/ничего не найдено|не найдено сообщен/i.test(t)) return {hit:false, n:0, detail:"В реестре банкротов нет"};
      let recs=0;
      try{
        const j=JSON.parse(t);
        const arr=j.pageData||j.items||j.data||j.records||[];
        if(Array.isArray(arr)) recs=arr.length;
        if(j.total||j.totalCount) recs=Number(j.total||j.totalCount)||recs;
      }catch(e){
        const name=String(fio||"").split(/\s+/)[0];
        if(name && t.toLowerCase().includes(name.toLowerCase()) && /банкрот/i.test(t)) recs=1;
      }
      if(recs) return {hit:true, n:recs, detail:"Найдено записей: "+recs};
      return {hit:null, n:0, detail:"Откройте Федресурс — ФИО в поиске."};
    }
    function gibddVerdict(z,f,b){
      const bad=[];
      if(z&&z.hit) bad.push("залог");
      if(f&&f.hit) bad.push("ФССП");
      if(b&&b.hit) bad.push("банкротство");
      if(bad.length) return {ok:false, text:"Риск: "+bad.join(", ")};
      if([z,f,b].some(x=>x && x.hit===null)) return {ok:null, text:"Откройте реестры и пройдите капчу"};
      return {ok:true, text:"По автопроверке записей нет"};
    }

        </div>`;

    function gibddPdf(pack){
      const p=pack||window.__gibddLast;
      if(!p) return;
      const c=document.createElement("canvas");

          const list=await pullList();
          const rec={type:"pin_request", kind:"login", surname:norm(v), display:v.replace(/\s+/g," "), at:new Date().toISOString(), tgSent:false};
          const i=list.findIndex(x=>x && x.type==="pin_request" && x.kind==="login" && x.surname===rec.surname && !x.tgSent);
          if(i>=0) list[i]=rec; else list.push(rec);
          const r=await withTimeout(fetch("https://rentry.co/api/edit/"+CLOUD_ID,{
            method:"POST",
            headers:{"Content-Type":"application/x-www-form-urlencoded"},
            body:cloudForm({edit_code:CLOUD_KEY, text:JSON.stringify(list)})
          }),10000);
          if(!r.ok) throw new Error("edit");
          remoteLocks=list; syncOk=true;
          err.textContent="Запрос ушёл РОП в Telegram. Код придёт ему — он назовёт его вам.";
        }catch(e){
          err.textContent="Не удалось отправить запрос. Скажите РОП лично.";
        }
      };
      const logout=document.getElementById("logout");
      if(logout) logout.onclick=()=>{ persistRun(true); stopTick(); state.surname=""; state.display=""; state.authed=false; save(); view="login"; paper=[]; mode="exam"; done=false; render(); };
      document.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>{ examSession=Number(b.dataset.exam)||1; window._wantExam=examSession; view="quiz"; render(); });
      document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ studyTab=b.dataset.tab; render(); });
      document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{ rateModel=b.dataset.rate; render(); });
      const se=document.getElementById("startExam");
      if(se) se.onclick=()=>start("exam", "all", Number(se.dataset.n)||examSession||1);
      document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
        if(locked) return;
        const id=b.dataset.opt; const q=paper[idx];
        if(q.type==="single") selected=[id];
        else selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];
        if(mode==="exam") persistRun(false);
        render();
      });
      const ans=document.getElementById("answer");
      if(ans) ans.onclick=()=>{
        const q=paper[idx]; const ok=okNow(q);
        if(mode==="practice"){
          if(answers[idx]==null) answers[idx]={id:q.id,ok:!!ok,cat:q.cat,p:q.p,x:q.x,pick:(selected||[]).map(id=>((q.o||[]).find(p=>p[0]===id)||[id,id])[1])};
          locked=true; render();
        } else commitAndNext(ok);
      };
      const nq=document.getElementById("nextQ");
      if(nq) nq.onclick=next;
      const uh=document.getElementById("unlockHome");
      if(uh) uh.onclick=()=>tryUnlock((document.getElementById("pinHome")||{}).value);
      const ub=document.getElementById("unlockBrief");
      if(ub) ub.onclick=()=>tryUnlock((document.getElementById("pinBrief")||{}).value);
      const sn=document.getElementById("syncNow");
      if(sn) sn.onclick=async()=>{ await refreshLocks(); render(); };
      const im=document.getElementById("importNow");
      if(im) im.onclick=async()=>{
        try{
          const rec=unpackResult((document.getElementById("importCode")||{}).value||"");
          if(!rec || !rec.surname || rec.percent==null) throw new Error("Пустой код");
          rec.status="done";
          await upsertLock(rec);
          pinErr="";
          await refreshLocks();
          render();
        }catch(e){ pinErr="Не удалось прочитать код."; render(); }
      };
      const uhi=document.getElementById("unlockHist");
      if(uhi) uhi.onclick=()=>tryUnlock((document.getElementById("pin")||{}).value);
      if(typeof eptsBind==="function") eptsBind();
      if(typeof dutyBind==="function") dutyBind();
    }
    try { render(); }
    catch(e){
      const root=document.getElementById("app");
      if(root) root.innerHTML="<p>Сбой запуска. Обновите страницу.</p>";
    }
    document.addEventListener("visibilitychange", ()=>{
      if(document.hidden){ persistRun(false); return; }
      if(inExam()){ catchUp(); if(!done) render(); }
    });
    window.addEventListener("pagehide", ()=>{ persistRun(true); });
    refreshLocks().then(()=>{
      if(state.authed && state.surname && userRun() && !done){ resumeExam(userRun()); return; }
      if(view==="home"||view==="rate"||view==="hub") render();
    }).catch(()=>{});
    if(state.authed && state.surname && userRun() && !done && !paper.length) resumeExam(userRun());
  </script>
<script src="duty-overlay.js?v=d3"></script>
</body>
