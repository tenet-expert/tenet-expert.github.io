name: rebuild-stock
on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-part1.json'
      - 'stock-part2.json'
      - 'manual-reserved.json'
      - 'scripts/merge_stock.py'
      - '.github/workflows/rebuild-stock.yml'
concurrency:
  group: rebuild-stock
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge parts into stock.json + apply manual-reserved.json, commit and push
        run: |
          set -e
          git config user.name "tenet-expert-bot"
          git config user.email "bot@tenet-expert.github.io"
          # Always rebuild from the latest main so a newer parts push is never overwritten.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/merge_stock.py
            git add stock.json
            if git diff --staged --quiet; then echo "no change"; exit 0; fi
            UPD=$(python3 -c "import json;print(json.load(open('stock.json')).get('updated',''))")
            git commit -m "склад: rebuild stock.json from parts $UPD (+manual-reserved)"
            if git push origin HEAD:main; then exit 0; fi
            echo "push retry $i"
            sleep 3
          done
          exit 1
