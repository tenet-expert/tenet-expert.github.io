name: telegram

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then export TG_BOT_TOKEN='8786662259:AAFqqZFGix3wU77NlplleCS4bM9eaiYle9M'; fi
          if [ -z "$TG_CHAT_ID" ]; then export TG_CHAT_ID='1928859'; fi
          python3 scripts/tg-bot.py
